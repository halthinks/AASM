name: Feature request
description: Propose a capability or architectural improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What are you trying to accomplish? Describe the underlying workflow or constraint.
    validations:
      required: true
  - type: textarea
    id: limitation
    attributes:
      label: Current limitation
      description: Why can AASM not handle this cleanly today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: An implementation idea is welcome, but the use case matters more than a prescribed design.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - State machine / transitions
        - Graph planning / algorithms
        - Checkpointing / memory
        - Resource allocation
        - Verification / evidence
        - Authority / governance
        - Protocol / adapter
        - Persistence / runtime
        - CLI / developer experience
        - Documentation / examples
        - Other
