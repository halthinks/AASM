name: Documentation improvement
description: Report unclear, missing, or incorrect documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: Where is the problem?
      description: Link or name the README section, document, example, or API.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What should be clearer or corrected?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
