name: Export qualified artifact lineage public source bytes

on:
  push:
    branches: [artifact-lineage-public-adoption]

permissions:
  contents: read

jobs:
  export-qualified-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Recreate qualified public-adoption source
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^          python - <<'"'"'PY'"'"'$/ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/promote-artifact-lineage-public.yml > /tmp/promote.py
          test -s /tmp/promote.py
          python /tmp/promote.py
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/test_artifact_lineage_foundation.py')
          text=path.read_text(encoding='utf-8')
          old='assert contract["runtime_admission"] == "PRE_ADMISSION_ONLY"'
          new='assert contract["runtime_admission"] == "ACTIVE_PUBLIC_ADOPTION"'
          if text.count(old) != 1:
              raise SystemExit(f'foundation admission assertion anchor count={text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Requalify exported bytes
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests scripts
          python scripts/check_artifact_lineage_contracts.py
          pytest -q tests/test_artifact_lineage_foundation.py
          pytest -q tests/test_artifact_lineage_envelope.py
          pytest -q tests/test_artifact_lineage_runtime.py
          pytest -q tests/test_v56_public_candidate.py
          git diff --check
      - name: Stage exact qualified files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualified/src/aasm qualified/tests qualified/scripts qualified/.github/workflows
          cp src/aasm/artifact_lineage.py qualified/src/aasm/
          cp src/aasm/artifact_lineage_runtime.py qualified/src/aasm/
          cp src/aasm/public_active.py qualified/src/aasm/
          cp tests/test_artifact_lineage_foundation.py qualified/tests/
          cp tests/test_artifact_lineage_runtime.py qualified/tests/
          cp tests/test_v56_public_candidate.py qualified/tests/
          cp scripts/check_artifact_lineage_contracts.py qualified/scripts/
          cp .github/workflows/artifact-lineage.yml qualified/.github/workflows/
          (cd qualified && sha256sum src/aasm/artifact_lineage.py src/aasm/artifact_lineage_runtime.py src/aasm/public_active.py \
            tests/test_artifact_lineage_foundation.py tests/test_artifact_lineage_runtime.py tests/test_v56_public_candidate.py \
            scripts/check_artifact_lineage_contracts.py .github/workflows/artifact-lineage.yml > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-lineage-public-03214-source
          path: qualified
          if-no-files-found: error
          retention-days: 1
