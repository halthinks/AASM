name: Recover S4.9 Atomic Implementation

on:
  push:
    branches: [main]

concurrency:
  group: aasm-s49-recovery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  statuses: write

jobs:
  recover-s49:
    if: github.event.head_commit.message == 'Recover atomic S4.9 implementation'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Publish S4.9 recovery start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context='aasm/s49-recovery' \
            -f description='S4.9 recovery materialization running' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install complete development dependencies
        run: |
          python -m pip install -e '.[dev,optimization]'
          python -m pip install 'ruff==0.15.22'
      - name: Repair staged S4.9 transport assumptions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/s49_payload.py')
          source = path.read_text(encoding='utf-8')

          inventory_marker = '# Update the canonical tracked-file inventory using its literal Python collection.'
          if inventory_marker not in source:
              raise SystemExit('S4.9 inventory repair marker missing')
          inventory_replacement = '''# Update the canonical tracked-file inventory from the actual materialized checkout.\nsubprocess.run(\n    ["python", "scripts/release_manifest.py", "--write-file-list"],\n    check=True,\n)\n\nprint("S4.9 payload materialized")\n'''
          source = source.split(inventory_marker, 1)[0] + inventory_replacement

          old = '''        changed.pop("fingerprint")\n        mismatch = ManualOverride.from_dict(changed)'''
          new = '''        changed.pop("fingerprint")\n        changed.pop("override_id")\n        mismatch = ManualOverride.from_dict(changed)'''
          if old not in source:
              raise SystemExit('S4.9 accepted-risk adversarial fixture anchor missing')
          source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY
      - name: Materialize S4.9 from staged canonical payload
        run: python .github/s49_payload.py
      - name: Normalize S4.9 Python surface
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            src/aasm/epistemic_debt_manual_override.py
            src/aasm/_epistemic_debt.py
            src/aasm/_manual_override.py
            scripts/check_epistemic_debt_manual_override_contracts.py
            scripts/check_s49_release_contracts.py
            tests/test_epistemic_debt_manual_override_foundation.py
          )
          ruff check --fix "${paths[@]}" || true
          ruff format "${paths[@]}"
          ruff check "${paths[@]}"
      - name: Normalize generated text whitespace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for name in (
              "README.md",
              "docs/roadmaps/GOVERNED_SEMANTIC_EVOLUTION_ROADMAP.md",
          ):
              path = Path(name)
              lines = path.read_text(encoding="utf-8").splitlines()
              path.write_text("\n".join(line.rstrip() for line in lines) + "\n", encoding="utf-8")
          PY
      - name: Remove S4.9 transport files only
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/s49_payload.py \
            .github/workflows/advance-s49.yml \
            .github/workflows/advance-s49-recovery.yml \
            .github/workflows/repair-s48-ci.yml
          python scripts/release_manifest.py --write-file-list
      - name: Validate S4.9 contracts and adversarial corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/aasm/epistemic_debt_manual_override.py \
            src/aasm/_epistemic_debt.py \
            src/aasm/_manual_override.py \
            scripts/check_epistemic_debt_manual_override_contracts.py \
            scripts/check_s49_release_contracts.py \
            tests/test_epistemic_debt_manual_override_foundation.py
          python -m json.tool schemas/epistemic-debt.schema.json >/dev/null
          python -m json.tool schemas/manual-override.schema.json >/dev/null
          python -m json.tool schemas/manual-override-assessment.schema.json >/dev/null
          python scripts/check_epistemic_debt_manual_override_contracts.py
          pytest -q tests/test_epistemic_debt_manual_override_foundation.py
      - name: Requalify cumulative S4 through S4.9
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_quantity_contracts.py
          python scripts/check_quantity_public.py
          python scripts/check_rule_contracts.py
          python scripts/check_rule_public.py
          python scripts/check_semantic_projection_contracts.py
          python scripts/check_semantic_projection_public.py
          python scripts/check_uncertainty_scenario_trace_contracts.py
          python scripts/check_uncertainty_scenario_trace_public.py
          python scripts/check_degraded_operation_contracts.py
          python scripts/check_degraded_operation_public.py
          python scripts/check_risk_irreversibility_contracts.py
          python scripts/check_obligation_phase_contracts.py
          python scripts/check_safety_envelope_hybrid_state_contracts.py
          pytest -q \
            tests/test_quantity_foundation.py \
            tests/test_quantity_public.py \
            tests/test_rule_foundation.py \
            tests/test_rule_public.py \
            tests/test_semantic_projection_foundation.py \
            tests/test_semantic_projection_textpcb.py \
            tests/test_semantic_projection_adversarial.py \
            tests/test_semantic_projection_public.py \
            tests/test_uncertainty_scenario_trace_foundation.py \
            tests/test_uncertainty_scenario_trace_public.py \
            tests/test_degraded_operation_foundation.py \
            tests/test_degraded_operation_public.py \
            tests/test_risk_irreversibility_foundation.py \
            tests/test_obligation_phase_foundation.py \
            tests/test_safety_envelope_hybrid_state_foundation.py \
            tests/test_epistemic_debt_manual_override_foundation.py
      - name: Enforce cumulative release boundaries
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_manifest.py --check-file-list
          python scripts/check_release_contracts.py
          python scripts/check_s48_release_contracts.py
          python scripts/check_s49_release_contracts.py
          python scripts/check_version_policy.py
          git diff --check
      - name: Commit and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement S4.9 epistemic debt and manual override'
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            git rebase origin/main
            python scripts/release_manifest.py --write-file-list
            python scripts/release_manifest.py --check-file-list
            python scripts/check_release_contracts.py
            python scripts/check_s48_release_contracts.py
            python scripts/check_s49_release_contracts.py
            python scripts/check_epistemic_debt_manual_override_contracts.py
            pytest -q tests/test_epistemic_debt_manual_override_foundation.py
            git add FILE_LIST.txt
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
      - name: Publish S4.9 recovery outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='S4.9 recovery materialization completed'
          else
            state=failure
            description='S4.9 recovery materialization failed; inspect run logs'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='aasm/s49-recovery' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
