name: AASM S5.6 TextPCB Refinement Qualification

# Existing-workflow trigger marker: 2026-08-20
on:
  push:
    branches: [main, s5-6-textpcb-refinement]
    paths:
      - 'src/aasm/textpcb_refinement.py'
      - 'fixtures/textpcb/s5-refinement-qualification-fixtures.json'
      - 'fixtures/textpcb/s4-safety-governance-fixtures.json'
      - 'schemas/textpcb-refinement-qualification.schema.json'
      - 'scripts/check_textpcb_refinement_contracts.py'
      - 'tests/test_textpcb_refinement.py'
      - '.github/workflows/textpcb-refinement.yml'
      - 'src/aasm/refinement.py'
      - 'src/aasm/refinement_runtime.py'
      - 'src/aasm/refinement_runtime_assurance.py'
  pull_request:
    branches: [main]
    paths:
      - 'src/aasm/textpcb_refinement.py'
      - 'fixtures/textpcb/s5-refinement-qualification-fixtures.json'
      - 'fixtures/textpcb/s4-safety-governance-fixtures.json'
      - 'schemas/textpcb-refinement-qualification.schema.json'
      - 'scripts/check_textpcb_refinement_contracts.py'
      - 'tests/test_textpcb_refinement.py'
      - '.github/workflows/textpcb-refinement.yml'
      - 'src/aasm/refinement.py'
      - 'src/aasm/refinement_runtime.py'
      - 'src/aasm/refinement_runtime_assurance.py'
  workflow_dispatch:

concurrency:
  group: aasm-textpcb-refinement-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  textpcb-refinement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install AASM development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile and validate S5.6 qualification artifacts
        run: |
          python -m compileall -q \
            src/aasm/textpcb_refinement.py \
            scripts/check_textpcb_refinement_contracts.py \
            tests/test_textpcb_refinement.py
          python -m json.tool fixtures/textpcb/s5-refinement-qualification-fixtures.json >/dev/null
          python -m json.tool schemas/textpcb-refinement-qualification.schema.json >/dev/null
          python -m json.tool fixtures/textpcb/s4-safety-governance-fixtures.json >/dev/null
      - name: Check TextPCB adapter, generic refinement, and safety firewalls
        run: |
          python scripts/check_textpcb_refinement_contracts.py
          python scripts/check_refinement_contracts.py
          python scripts/check_refinement_runtime_contracts.py
          python scripts/check_refinement_assurance_contracts.py
          python scripts/check_safety_governance_contracts.py
      - name: Run S5.6 plus parent refinement and permanent TextPCB safety corpora
        run: |
          pytest -q \
            tests/test_textpcb_refinement.py \
            tests/test_refinement_foundation.py \
            tests/test_refinement_runtime.py \
            tests/test_refinement_runtime_assurance.py \
            tests/test_textpcb_s4_safety_governance.py
      - name: Publish S5.6 TextPCB refinement qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='S5.6 TextPCB generic refinement and safety qualification passed'
          else
            state=failure
            description='S5.6 TextPCB generic refinement or safety qualification failed'
          fi
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context='aasm/textpcb-refinement' \
              -f description="$description" \
              -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          echo 'failed to publish aasm/textpcb-refinement after bounded retries' >&2
          exit 1
