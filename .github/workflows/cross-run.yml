name: Cross-Run Knowledge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  cross_run_knowledge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile v0.48 staging surface
        run: python -m compileall -q src/aasm/cross_run_knowledge.py src/aasm/_runtime_v48_knowledge.py src/aasm/runtime_v48.py tests/test_v48_cross_run_knowledge.py
      - name: Run cross-run admission, revocation, reuse, privacy, and SII separation tests
        run: pytest -q tests/test_v48_cross_run_knowledge.py
