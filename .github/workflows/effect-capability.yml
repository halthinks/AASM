name: Bounded Effect Capability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  effect_capability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install bounded effect capability dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile bounded effect capability surface
        run: python -m compileall -q src/aasm/effect_capability.py src/aasm/effect_capability_runtime.py src/aasm/effect_capability_revocation_guard.py tests/test_effect_capability.py scripts/check_effect_capability_contracts.py
      - name: Validate bounded effect capability source contracts
        run: python scripts/check_effect_capability_contracts.py
      - name: Run bounded effect capability adversarial and replay tests
        run: pytest -q tests/test_effect_capability.py
      - name: Publish Bounded Effect Capability status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='bounded operations/bounds/validity/epoch/delegation/revocation and no-effect-authority boundary passed'
          else
            state=failure
            description='bounded effect capability qualification failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context='aasm/effect-capability' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
