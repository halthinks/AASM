name: One-shot S5.5 qualification and publication

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/s5-5-publication.yml

permissions:
  contents: write

jobs:
  qualify-publish-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile and qualify S5.5
        run: |
          set -euo pipefail
          python -m compileall -q src/aasm/core_conflict.py src/aasm/core_conflict_runtime.py scripts/check_core_conflict_contracts.py tests/test_core_conflict.py
          python -m json.tool schemas/core-conflict.schema.json >/dev/null
          python scripts/check_core_conflict_contracts.py
          pytest -q tests/test_core_conflict.py
      - name: Advance canonical README and roadmap after qualification
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '**Qualified development boundary:** PR-1 + PR-2 + complete PR-3 / PHY-01 + complete S3 + active S4 public lineage through Degraded Operation 0.32.20 + complete S5.1-S5.4 pre-admission foundations, with S5.4 Knowledge Applicability/Application qualified under `aasm/knowledge-applicability`\n**Next unfinished boundary:** S5.5 — Integrated Core/Conflict Pipeline'
          new = '**Qualified development boundary:** PR-1 + PR-2 + complete PR-3 / PHY-01 + complete S3 + active S4 public lineage through Degraded Operation 0.32.20 + complete S5.1-S5.5 pre-admission foundations, with S5.4 Knowledge Applicability/Application qualified under `aasm/knowledge-applicability` and S5.5 Integrated Core/Conflict qualified under `aasm/core-conflict`\n**Next unfinished boundary:** S5.6 — TextPCB Refinement Qualification'
          if old not in text:
              raise SystemExit('README S5.5 publication anchor missing')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')

          roadmap = Path('docs/roadmaps/GOVERNED_SEMANTIC_EVOLUTION_ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '**Next seam:** S5.5 integrated core/conflict pipeline after implemented S5.1-S5.4 foundations.'
          new = '**Next seam:** S5.6 TextPCB refinement qualification after implemented and qualified S5.1-S5.5 foundations.'
          if old not in text:
              raise SystemExit('roadmap next-seam S5.5 anchor missing')
          text = text.replace(old, new, 1)
          old = '## 5.5 Integrated core/conflict pipeline\n\nPreserve external references through raw -> normalized -> minimized -> independently rechecked cores/conflicts. Clearly distinguish irreducible, minimum/minimum-weight and budget-limited partial claims.'
          new = '## 5.5 Integrated core/conflict pipeline\n\n**Status: FOUNDATION IMPLEMENTED AND QUALIFIED; pre-admission runtime active under `aasm/core-conflict`. Public admission remains `PRE_ADMISSION_ONLY`.**\n\nPreserve external references through raw -> normalized -> minimized -> independently rechecked cores/conflicts. Clearly distinguish irreducible, minimum/minimum-weight and budget-limited partial claims.'
          if old not in text:
              raise SystemExit('roadmap S5.5 section anchor missing')
          roadmap.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove publication workflow and commit qualified state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/s5-5-publication.yml
          git add README.md docs/roadmaps/GOVERNED_SEMANTIC_EVOLUTION_ROADMAP.md
          git commit -m 'Qualify S5.5 integrated core conflict pipeline'
          git push origin HEAD:main
      - name: Delete temporary S5.5 implementation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/s5-5-integrated-core-conflict" || {
            status=$?
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/s5-5-integrated-core-conflict" >/dev/null 2>&1; then
              exit "$status"
            fi
          }
