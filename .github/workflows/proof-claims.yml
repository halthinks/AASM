name: Proof Claims

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  proof_claims:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile proof-claim surface
        run: python -m compileall -q src/aasm/proof_claims.py src/aasm/_runtime_v50_proof.py src/aasm/runtime_v50.py src/aasm/proof_claim_conformance.py src/aasm/public_v50.py src/aasm/cli_v50.py tests/test_v50_proof_claims.py tests/test_v50_proof_claim_limits.py tests/test_v50_public.py
      - name: Run proof-claim tests
        run: pytest -q tests/test_v50_proof_claims.py tests/test_v50_proof_claim_limits.py tests/test_v50_public.py
      - name: Run proof-claim conformance
        run: |
          python - <<'PY'
          import json
          from aasm.proof_claim_conformance import run_solver_proof_conformance
          report = run_solver_proof_conformance()
          print(json.dumps(report, sort_keys=True))
          if report['status'] != 'PASS':
              raise SystemExit(1)
          PY
      - name: Run v0.50 public CLI surfaces
        run: |
          python - <<'PY'
          import contextlib, io, json
          from aasm.cli_v50 import main
          for command in (["solver-proof-contract"], ["solver-proof-conformance"]):
              out = io.StringIO()
              with contextlib.redirect_stdout(out):
                  main(command)
              json.loads(out.getvalue())
          PY
      - name: Publish Proof Claims status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='proof claims, public contract, CLI, applicability, and conformance passed'
          else
            state=failure
            description='proof-carrying solver claim gate failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context='aasm/proof-claims' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
