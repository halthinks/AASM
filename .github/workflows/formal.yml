name: Formal Assurance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  model_check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate architecture and release contracts
        run: |
          python scripts/check_formal_models.py
          python scripts/check_release_contracts.py

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path("formal/toolchain.lock.json").read_text())
          print(f"tla_url={lock['tla_plus']['url']}")
          print(f"tla_sha256={lock['tla_plus']['sha256']}")
          print(f"spin_url={lock['spin']['url']}")
          print(f"spin_sha256={lock['spin']['sha256']}")
          PY

      - name: Verify every bounded TLA+ model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            "${{ steps.toolchain.outputs.tla_url }}" -o /tmp/tla2tools.jar
          echo "${{ steps.toolchain.outputs.tla_sha256 }}  /tmp/tla2tools.jar" | sha256sum --check -
          cd formal
          for cfg in *.cfg; do
            module="${cfg%.cfg}"
            echo "TLC: $module"
            java -cp /tmp/tla2tools.jar tlc2.TLC -workers 2 -config "$cfg" "$module.tla"
          done

      - name: Verify every bounded Promela model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            "${{ steps.toolchain.outputs.spin_url }}" -o /tmp/spin.tar.gz
          echo "${{ steps.toolchain.outputs.spin_sha256 }}  /tmp/spin.tar.gz" | sha256sum --check -
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison
          mkdir -p /tmp/spin-src
          tar -xzf /tmp/spin.tar.gz -C /tmp/spin-src --strip-components=1
          make -C /tmp/spin-src/Src -j2
          cd formal
          index=0
          for model in *.pml; do
            index=$((index + 1))
            rm -f pan.c pan.h pan.m pan.b pan.p pan.t pan.pre
            echo "SPIN: $model"
            /tmp/spin-src/Src/spin -a "$model"
            gcc -O2 -o "/tmp/aasm-pan-$index" pan.c
            "/tmp/aasm-pan-$index" -m100000 | tee "/tmp/aasm-spin-$index.log"
            grep -Eq 'errors:[[:space:]]*0' "/tmp/aasm-spin-$index.log"
            if grep -Eq 'errors:[[:space:]]*[1-9][0-9]*' "/tmp/aasm-spin-$index.log"; then
              echo "SPIN reported verification errors for $model"
              exit 1
            fi
          done

      - name: Publish formal assurance status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          if [ "$RESULT" = "success" ]; then state=success; else state=failure; fi
          export state
          python - <<'PY' > /tmp/formal-status.json
          import json, os
          print(json.dumps({
              "state": os.environ["state"],
              "context": "aasm/formal-assurance",
              "description": f"all registered TLC/SPIN and source contracts {os.environ['RESULT']}",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/formal-status.json
          test "$state" = success
