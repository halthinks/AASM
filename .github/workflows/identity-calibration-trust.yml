name: AASM S3 Identity Calibration Trust Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-identity-calibration-trust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  identity_calibration_trust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install S3 identity/calibration/trust qualification dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile S3 identity calibration trust foundation
        run: |
          python -m compileall -q \
            src/aasm/physical_identity.py src/aasm/physical_identity_runtime.py \
            src/aasm/calibration.py src/aasm/calibration_runtime.py \
            src/aasm/source_trust.py src/aasm/source_trust_runtime.py \
            tests/test_identity_calibration_trust.py scripts/check_identity_calibration_trust_contracts.py
      - name: Check S3 identity calibration trust source contracts
        run: python scripts/check_identity_calibration_trust_contracts.py
      - name: Run S3 embedded, TextPCB-derived, authority-firewall, and replay fixtures
        run: pytest -q tests/test_identity_calibration_trust.py
      - name: Publish S3 identity calibration trust qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='S3 identity+calibration+source-trust qualification passed'
          else
            state=failure
            description='S3 identity+calibration+source-trust qualification failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context='aasm/identity-calibration-trust' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
