name: AASM S3 Physical Evidence Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-physical-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  physical_evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install S3 physical evidence qualification dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile cumulative S3 physical evidence foundation
        run: |
          python -m compileall -q \
            src/aasm/state_conflict.py src/aasm/state_conflict_runtime.py \
            src/aasm/event_causality.py src/aasm/event_causality_runtime.py \
            src/aasm/observation_freshness.py src/aasm/observation_freshness_runtime.py \
            src/aasm/physical_identity.py src/aasm/physical_identity_runtime.py \
            src/aasm/calibration.py src/aasm/calibration_runtime.py \
            src/aasm/source_trust.py src/aasm/source_trust_runtime.py \
            src/aasm/execution_environment.py src/aasm/execution_environment_runtime.py \
            src/aasm/observation_lifecycle.py src/aasm/observation_fusion.py src/aasm/observation_processing_runtime.py \
            tests/test_state_conflict.py tests/test_causal_freshness.py tests/test_identity_calibration_trust.py \
            tests/test_execution_environment.py tests/test_observation_processing.py \
            scripts/check_state_conflict_contracts.py scripts/check_causal_freshness_contracts.py \
            scripts/check_identity_calibration_trust_contracts.py scripts/check_execution_environment_contracts.py \
            scripts/check_observation_processing_contracts.py
      - name: Check S3 state-conflict source contracts
        run: python scripts/check_state_conflict_contracts.py
      - name: Check S3 causal identity and freshness source contracts
        run: python scripts/check_causal_freshness_contracts.py
      - name: Check S3 identity calibration trust source contracts
        run: python scripts/check_identity_calibration_trust_contracts.py
      - name: Check S3 execution environment source contracts
        run: python scripts/check_execution_environment_contracts.py
      - name: Check S3 observation lifecycle and fusion source contracts
        run: python scripts/check_observation_processing_contracts.py
      - name: Run S3 state-conflict adversarial, TextPCB-derived, and replay fixtures
        run: pytest -q tests/test_state_conflict.py
      - name: Run S3 causal/freshness embedded, TextPCB-derived, and replay fixtures
        run: pytest -q tests/test_causal_freshness.py
      - name: Run S3 identity/calibration/trust embedded, TextPCB-derived, authority-firewall, and replay fixtures
        run: pytest -q tests/test_identity_calibration_trust.py
      - name: Run S3 execution-environment laundering, TextPCB-derived, authority-firewall, and replay fixtures
        run: pytest -q tests/test_execution_environment.py
      - name: Run S3 observation lifecycle, fusion, epistemic-containment, and replay fixtures
        run: pytest -q tests/test_observation_processing.py
      - name: Publish cumulative S3 physical evidence qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='S3 reality evidence + environment + lifecycle/fusion epistemics passed'
          else
            state=failure
            description='S3 physical evidence qualification failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context='aasm/physical-evidence' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
