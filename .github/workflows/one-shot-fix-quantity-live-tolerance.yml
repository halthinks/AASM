name: One-shot quantity live-tolerance alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-quantity-live-tolerance.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Align non-regression assertions to the live solver tolerance contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          checker = Path('scripts/check_quantity_contracts.py')
          text = checker.read_text(encoding='utf-8')
          old = (
              '    expected_legacy_fields = {\n'
              '        "absolute",\n'
              '        "relative",\n'
              '        "primal_feasibility",\n'
              '        "dual_feasibility",\n'
              '        "integrality",\n'
              '        "mip_gap",\n'
              '    }\n'
          )
          new = (
              '    expected_legacy_fields = {\n'
              '        "policy_id",\n'
              '        "contract_id",\n'
              '        "contract_version",\n'
              '        "absolute_tolerance",\n'
              '        "relative_tolerance",\n'
              '        "precision",\n'
              '        "fingerprint",\n'
              '    }\n'
              '    require(legacy_tolerance["properties"]["contract_id"]["const"] == "aasm.numeric.tolerance.v1", "legacy numeric tolerance contract ID drift")\n'
              '    require(legacy_tolerance["properties"]["absolute_tolerance"]["type"] == "string", "legacy absolute tolerance lost exact-string encoding")\n'
              '    require(legacy_tolerance["properties"]["relative_tolerance"]["type"] == "string", "legacy relative tolerance lost exact-string encoding")\n'
          )
          if text.count(old) != 1:
              raise SystemExit('quantity checker live-tolerance alignment anchor drift')
          checker.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_quantity_foundation.py')
          text = tests.read_text(encoding='utf-8')
          old = (
              '    assert set(schema["properties"]) == {\n'
              '        "absolute",\n'
              '        "relative",\n'
              '        "primal_feasibility",\n'
              '        "dual_feasibility",\n'
              '        "integrality",\n'
              '        "mip_gap",\n'
              '    }\n'
          )
          new = (
              '    assert set(schema["properties"]) == {\n'
              '        "policy_id",\n'
              '        "contract_id",\n'
              '        "contract_version",\n'
              '        "absolute_tolerance",\n'
              '        "relative_tolerance",\n'
              '        "precision",\n'
              '        "fingerprint",\n'
              '    }\n'
              '    assert schema["properties"]["contract_id"]["const"] == "aasm.numeric.tolerance.v1"\n'
              '    assert schema["properties"]["absolute_tolerance"]["type"] == "string"\n'
              '    assert schema["properties"]["relative_tolerance"]["type"] == "string"\n'
          )
          if text.count(old) != 1:
              raise SystemExit('quantity test live-tolerance alignment anchor drift')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q scripts/check_quantity_contracts.py tests/test_quantity_foundation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check_quantity_contracts.py tests/test_quantity_foundation.py
          git commit -m 'Preserve live numeric tolerance contract in S4 checks'
          git push origin HEAD:main
