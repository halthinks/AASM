name: AASM Engineering Uncertainty Scenario Trace Public Candidate Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-engineering-uncertainty-scenario-trace-public-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  engineering-uncertainty-scenario-trace-public:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AASM development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile S4.4 public candidate and foundation
        run: |
          python -m compileall -q \
            src/aasm/uncertainty_scenario_trace.py \
            src/aasm/public_active_uncertainty_scenario_trace.py \
            scripts/check_uncertainty_scenario_trace_contracts.py \
            scripts/check_uncertainty_scenario_trace_public_candidate.py \
            tests/test_uncertainty_scenario_trace_foundation.py \
            tests/test_uncertainty_scenario_trace_public_candidate.py
          python -m json.tool schemas/uncertainty.schema.json >/dev/null
          python -m json.tool schemas/scenario.schema.json >/dev/null
          python -m json.tool schemas/trace-property.schema.json >/dev/null
      - name: Check S4.4 foundation firewalls
        run: python scripts/check_uncertainty_scenario_trace_contracts.py
      - name: Check 0.32.19 public candidate firewalls
        run: python scripts/check_uncertainty_scenario_trace_public_candidate.py
      - name: Run S4.4 foundation and public candidate adversarial corpus
        run: |
          pytest -q \
            tests/test_uncertainty_scenario_trace_foundation.py \
            tests/test_uncertainty_scenario_trace_public_candidate.py
      - name: Publish S4.4 public candidate qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='S4.4 uncertainty/scenario/trace-property public candidate 0.32.19 passed'
          else
            state=failure
            description='S4.4 uncertainty/scenario/trace-property public candidate 0.32.19 failed'
          fi
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context='aasm/engineering-uncertainty-scenario-trace-public' \
              -f description="$description" \
              -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          echo 'failed to publish aasm/engineering-uncertainty-scenario-trace-public after bounded retries' >&2
          exit 1
