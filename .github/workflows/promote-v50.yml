name: Promote v0.50

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message == 'Run v0.50 promotion workflow'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply v0.50 promotion
        run: python scripts/_promote_v50_fix.py
      - name: Remove one-shot promotion helpers
        run: rm .github/workflows/promote-v50.yml scripts/_promote_v50_once.py scripts/_promote_v50_fix.py
      - name: Validate promotion before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python scripts/check_formal_models.py
          python scripts/check_release_contracts.py
          python -m compileall -q src/aasm tests scripts
          pytest -q tests/test_v50_proof_claims.py tests/test_v50_proof_claim_limits.py tests/test_v50_public.py
      - name: Regenerate exact tracked inventory
        run: python scripts/release_manifest.py --write-file-list
      - name: Commit promotion to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Promote AASM v0.50.0 proof-carrying solver claims'
          git push origin HEAD:main
