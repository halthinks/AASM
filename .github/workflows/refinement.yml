name: AASM Governed Refinement Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-refinement-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  refinement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AASM development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile S5.1 governed refinement foundation
        run: |
          python -m compileall -q \
            src/aasm/refinement.py \
            src/aasm/refinement_runtime.py \
            scripts/check_refinement_contracts.py \
            scripts/check_refinement_runtime_contracts.py \
            tests/test_refinement_foundation.py \
            tests/test_refinement_runtime.py
          python -m json.tool schemas/refinement-proposal.schema.json >/dev/null
          python -m json.tool schemas/refinement-loop.schema.json >/dev/null
      - name: Check S5.1 source and pre-admission firewalls
        run: |
          python scripts/check_refinement_contracts.py
          python scripts/check_refinement_runtime_contracts.py
      - name: Run S5.1 adversarial foundation and durable-loop corpus
        run: |
          pytest -q \
            tests/test_refinement_foundation.py \
            tests/test_refinement_runtime.py
      - name: Publish S5.1 refinement qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='S5.1 governed refinement foundation and durable loop passed'
          else
            state=failure
            description='S5.1 governed refinement foundation or durable loop failed'
          fi
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context='aasm/refinement' \
              -f description="$description" \
              -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          echo 'failed to publish aasm/refinement after bounded retries' >&2
          exit 1
