name: State Authority

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  state_authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install state authority dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile stable state authority surface
        run: python -m compileall -q src/aasm/state_authority.py src/aasm/state_authority_runtime.py tests/test_state_authority.py scripts/check_state_authority_contracts.py
      - name: Validate state authority source contracts
        run: python scripts/check_state_authority_contracts.py
      - name: Run state authority adversarial and replay tests
        run: pytest -q tests/test_state_authority.py
      - name: Publish State Authority status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='fact authority, four state claims, authority firewall, and replay passed'
          else
            state=failure
            description='state authority qualification failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context='aasm/state-authority' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
