name: Physical Preemption Recovery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  preemption_recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install preemption recovery dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile recovery surface
        run: python -m compileall -q src/aasm/physical_preemption_recovery_guard.py tests/test_physical_preemption_recovery.py
      - name: Run crash recovery adversarial test
        run: pytest -q tests/test_physical_preemption_recovery.py
      - name: Publish Preemption Recovery status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='durable preemption crash-repair to canonical lease revocation passed'
          else
            state=failure
            description='physical preemption crash recovery qualification failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context='aasm/physical-preemption-recovery' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
