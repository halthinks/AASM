name: AASM Engineering Obligation Phase Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-engineering-obligation-phase-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  engineering-obligation-phase:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AASM development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile obligation-phase foundation and source firewall
        run: |
          python -m compileall -q \
            src/aasm/obligation_phase.py \
            scripts/check_obligation_phase_contracts.py \
            tests/test_obligation_phase_foundation.py
          python -m json.tool schemas/obligation-phase-binding.schema.json >/dev/null
          python -m json.tool schemas/obligation-phase-plan.schema.json >/dev/null
          python -m json.tool schemas/obligation-phase-assessment.schema.json >/dev/null
      - name: Check obligation-phase source contracts
        run: python scripts/check_obligation_phase_contracts.py
      - name: Run obligation-phase adversarial corpus
        run: pytest -q tests/test_obligation_phase_foundation.py
      - name: Publish obligation-phase qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='S4.7 obligation-phase pre-admission foundation passed'
          else
            state=failure
            description='S4.7 obligation-phase pre-admission foundation failed'
          fi
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context='aasm/engineering-obligation-phase' \
              -f description="$description" \
              -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          echo 'failed to publish aasm/engineering-obligation-phase after bounded retries' >&2
          exit 1
