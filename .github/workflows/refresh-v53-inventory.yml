name: Refresh v0.53 Inventory

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Rewrite canonical tracked inventory and remove this one-shot workflow
        run: |
          set -euo pipefail
          python scripts/release_manifest.py --write-file-list
          git rm .github/workflows/refresh-v53-inventory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FILE_LIST.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh canonical inventory for v0.53 foundation'
          git push origin HEAD:main
