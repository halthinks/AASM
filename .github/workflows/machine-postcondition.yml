name: Machine Postcondition Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  machine_postcondition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install machine postcondition dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile postcondition verification surface
        run: python -m compileall -q src/aasm/external_machine_postcondition.py src/aasm/external_machine_postcondition_runtime.py src/aasm/external_machine_postcondition_execution_correlation.py tests/test_machine_postcondition.py scripts/check_machine_postcondition_contracts.py
      - name: Validate machine postcondition source contracts
        run: python scripts/check_machine_postcondition_contracts.py
      - name: Run machine postcondition adversarial and replay tests
        run: pytest -q tests/test_machine_postcondition.py
      - name: Publish Machine Postcondition status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='effect success separated from achieved state; correlated authoritative postconditions passed'
          else
            state=failure
            description='machine postcondition verification qualification failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context='aasm/machine-postcondition' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
