name: Prepare mechanical v0.53 promotion once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply guarded v0.53 mechanical promotion
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected one replacement, found {count}: {old!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          replace_once('pyproject.toml','version = "0.52.0"','version = "0.53.0"')
          replace_once('src/aasm/__init__.py','from .public_v52 import *  # noqa: F401,F403','from .public_v53 import *  # noqa: F401,F403')
          replace_once('src/aasm/cli.py','from .cli_v52 import main','from .cli_v53 import main')

          release=Path('.github/workflows/release.yml'); text=release.read_text(encoding='utf-8')
          old='for context in aasm/ci-summary aasm/formal-assurance aasm/semantic-solver-rc aasm/proof-claims aasm/solution-pools aasm/optimization; do'
          new='for context in aasm/ci-summary aasm/formal-assurance aasm/semantic-solver-rc aasm/proof-claims aasm/solution-pools aasm/optimization aasm/scoped-authority aasm/solver-learning; do'
          if text.count(old)!=1: raise SystemExit('release workflow context loop drift')
          release.write_text(text.replace(old,new),encoding='utf-8')

          cli=Path('src/aasm/cli_v53.py'); text=cli.read_text(encoding='utf-8')
          text=text.replace('pre-release v0.53','v0.53')
          cli.write_text(text,encoding='utf-8')

          current='''# AASM v0.53.0 — Durable Cross-Run Solver Learning + Scoped Identity/Authority Hardening

## Current public release

- Version: `0.53.0`
- Adoption contract: `0.29.0`
- Release date: `2026-08-14`
- License: `Apache-2.0`
- Public API stability: `ACTIVE_DEVELOPMENT`
- Python: `>=3.11`
- Remote protocol compatibility remains `aasm.remote.v1 / 0.1.0`.

## What is release-complete

v0.53.0 makes scoped identity, authority, persistence access, resource ownership, external-effect authority, and durable cross-run solver learning first-class public AASM semantics.

The release adds:

- explicit `Principal / Workspace / Scope / Machine` identity seams;
- fail-closed scoped ALLOW/DENY authority with expiry, nondelegability, delegation ceilings, and DENY precedence;
- durable authority decisions and workspace trust-root bootstrap through ordinary AASM Evidence/events;
- scope-safe read-only persistence through `aasm.store.scoped.v1`, with raw multi-workspace access failing closed;
- principal-aware resource history derived from the exact scoped authority Evidence that permitted each mutation;
- optimistic machine-version guarded resource Evidence commits across MemoryStore, SQLite, and PostgreSQL so stale hosts cannot oversubscribe shared capacity;
- fresh scoped authorization for resource reservation/settlement and external effect authorize/execute/reconcile operations;
- `aasm.solver.learning.v1` for durable NO_GOOD, UNSAT_CORE, BOUND, INCUMBENT, WARM_START, and NATIVE_ACCELERATOR artifacts;
- exact v0.48 cross-run transport/admission reuse with foreign authority never inherited;
- receiving-run revalidation before correctness-sensitive solver learning can acquire pruning authority;
- `aasm.solver.learning.application.v1` for explicit validated application with truth and policy authority fixed to `NONE`;
- certified pruning lowered into the existing AASM OptimizationModel/provider path;
- validated incumbent/warm-start hints consumed by the existing OR-Tools CP-SAT provider using `CpModel.add_hint(...)`;
- dedicated `aasm/scoped-authority` and `aasm/solver-learning` exact-SHA release gates.

## Safety boundary

v0.53.0 keeps the following distinctions explicit:

- foreign knowledge is not local truth;
- resource availability is not permission;
- cross-run admission does not transfer authority;
- a validated solver-learning artifact is still not machine truth;
- solver-learning application requires exact local validation plus scoped `solver.learning.apply` authority;
- effects still require fresh scoped authority at the external execution boundary;
- direct persistence writes are not part of the scoped store facade;
- stale distributed resource commits fail closed and reload canonical state.

## Release evidence

The release boundary requires exact-SHA success from:

- `aasm/ci-summary`
- `aasm/formal-assurance`
- `aasm/semantic-solver-rc`
- `aasm/proof-claims`
- `aasm/solution-pools`
- `aasm/optimization`
- `aasm/scoped-authority`
- `aasm/solver-learning`
- `aasm/release`

## Next planned release

v0.54.0 — Certified Cross-Solver Exchange & Deterministic Portfolio Racing + Effect Ownership/UNKNOWN Recovery.
'''
          Path('docs/CURRENT_RELEASE.md').write_text(current,encoding='utf-8')
          notes='''# AASM v0.53.0 — Durable Cross-Run Solver Learning + Scoped Identity/Authority Hardening

AASM v0.53.0 hardens the public runtime around the two boundaries Hosted AASM and serious multi-host deployments need most: who is allowed to do what, and what learned solver state may safely survive across runs.

## Highlights

- `aasm.authority.scoped.v1`: explicit Principal/Workspace/Scope authority, default DENY, DENY precedence, expiry, nondelegability, delegation ceilings, no cross-run authority inheritance.
- `aasm.store.scoped.v1`: scope-safe read-only persistence facade; cross-workspace and ambiguous multi-workspace raw reads fail closed; writes remain governed runtime transitions.
- Resource governance now records principal/authority provenance and rejects stale distributed reservation commits across MemoryStore, SQLite, and PostgreSQL.
- Effect authorize, execute, retry, and reconcile paths require scoped authority; retries require fresh execution authority.
- `aasm.solver.learning.v1`: durable NO_GOOD, UNSAT_CORE, BOUND, INCUMBENT, WARM_START, and NATIVE_ACCELERATOR learning artifacts.
- Cross-run learning reuses the existing v0.48 `REUSE_RESULT` envelope/admission path. Foreign source authority is provenance only.
- Correctness-sensitive learning is inert until receiving-run revalidation succeeds for the exact model.
- `aasm.solver.learning.application.v1`: PASS validation + exact artifact/model binding + scoped `solver.learning.apply` are required before application.
- Pruning artifacts lower into the existing OptimizationModel/provider path; performance hints never gain truth or policy authority.
- The existing OR-Tools CP-SAT provider now explicitly consumes validated assignment hints through `CpModel.add_hint(...)` and reports consumed application IDs.

## Verification

The v0.53 promotion is gated by broad CI, formal assurance, Semantic Solver RC, proof claims, solution pools, native optimization, scoped authority/store/resource concurrency, solver learning/application, and reproducible release verification on the exact release SHA.
'''
          Path('docs/RELEASE_0.53.md').write_text(notes,encoding='utf-8')

          readme=Path('README.md'); text=readme.read_text(encoding='utf-8')
          for old,new in [
              ('release-v0.52.0','release-v0.53.0'),
              ('Release%3A%20v0.52.0','Release%3A%20v0.53.0'),
              ('Current release: **v0.52.0 — Lexicographic Multi-Objective & Pareto Solving — Resource-Governed Decision Foundation**.','Current release: **v0.53.0 — Durable Cross-Run Solver Learning + Scoped Identity/Authority Hardening**.'),
              ('Next planned release: **v0.53.0 — Durable Cross-Run Solver Learning + Scoped Identity/Authority Hardening**.','Next planned release: **v0.54.0 — Certified Cross-Solver Exchange & Deterministic Portfolio Racing + Effect Ownership/UNKNOWN Recovery**.'),
              ('pip install "aasm==0.52.0[formal]"','pip install "aasm==0.53.0[formal]"'),
              ("pip install 'aasm==0.52.0[formal]'","pip install 'aasm==0.53.0[formal]'"),
          ]:
              if old not in text: raise SystemExit(f'README promotion token missing: {old}')
              text=text.replace(old,new)
          marker='### v0.52.0 — Lexicographic Multi-Objective & Pareto Solving — Resource-Governed Decision Foundation\n'
          section='''### v0.53.0 — Durable Cross-Run Solver Learning + Scoped Identity/Authority Hardening (Current)\n\nv0.53.0 adds fail-closed Principal/Workspace/Scope authority, scope-safe persistence reads, three-store stale resource-commit protection, principal-aware resource provenance, fresh effect authority, durable cross-run solver learning with receiving-run revalidation, and explicit validated solver-learning application through the existing optimization provider path.\n\n'''
          if marker not in text: raise SystemExit('README v0.52 history marker missing')
          text=text.replace(marker,section+marker,1)
          readme.write_text(text,encoding='utf-8')

          changelog=Path('CHANGELOG.md'); text=changelog.read_text(encoding='utf-8')
          marker='## 0.52.0 — 2026-08-14\n'
          section='''## 0.53.0 — 2026-08-14\n\n### Added\n- Scoped Principal/Workspace/Scope authority with durable ALLOW/DENY decisions, delegation ceilings, expiry, nondelegability, and DENY precedence.\n- `aasm.store.scoped.v1` read-only fail-closed persistence facade.\n- Principal-aware resource provenance and optimistic machine-version resource commit guards across MemoryStore, SQLite, and PostgreSQL.\n- Scoped external-effect authorization for authorize/execute/reconcile, with fresh authority on retries.\n- Durable cross-run solver learning (`aasm.solver.learning.v1`) using the existing v0.48 admission path.\n- Receiving-run validation for NO_GOOD, UNSAT_CORE, BOUND, INCUMBENT, WARM_START, and NATIVE_ACCELERATOR artifacts.\n- Explicit solver-learning application contract (`aasm.solver.learning.application.v1`) with truth/policy authority fixed to NONE.\n- Existing OR-Tools CP-SAT provider consumption of validated assignment hints.\n- Dedicated `aasm/scoped-authority` and `aasm/solver-learning` release gates.\n\n### Changed\n- Current public adoption contract advances to `0.29.0`.\n- v0.53 becomes the active package/runtime surface; v0.52 remains available as a frozen versioned parent module.\n\n'''
          if marker not in text: raise SystemExit('CHANGELOG v0.52 marker missing')
          changelog.write_text(text.replace(marker,section+marker,1),encoding='utf-8')

          roadmap=Path('ROADMAP.md'); text=roadmap.read_text(encoding='utf-8')
          old='## v0.53.0 — Durable Cross-Run Solver Learning + Scoped Identity/Authority Hardening'
          new='## v0.53.0 — Durable Cross-Run Solver Learning + Scoped Identity/Authority Hardening [DONE 2026-08-14]'
          if text.count(old)!=1: raise SystemExit(f'ROADMAP v0.53 heading drift: {text.count(old)}')
          roadmap.write_text(text.replace(old,new),encoding='utf-8')

          current_tests=[
              'tests/test_v32_trace_conformance.py','tests/test_v37_reasoning.py','tests/test_v38_semantic_dependencies.py',
              'tests/test_v39_typed_capabilities.py','tests/test_v40_hierarchical_memory.py','tests/test_v42_reference_domains.py',
              'tests/test_v44_optimization.py','tests/test_v45_modeling_adapters.py','tests/test_v45_public.py',
              'tests/test_v46_advanced_optimization.py','tests/test_v46_public.py','tests/test_v47_public.py',
              'tests/test_v48_public.py','tests/test_v49_rc.py','tests/test_v49_rc_real.py',
          ]
          for name in current_tests:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              s=s.replace('0.52.0','0.53.0').replace('0.28.0','0.29.0')
              p.write_text(s,encoding='utf-8')

          p=Path('tests/test_v52_public.py'); s=p.read_text(encoding='utf-8')
          if 'from aasm import public_v52\n' not in s: raise SystemExit('test_v52_public import drift')
          s=s.replace('from aasm import public_v52\n','from aasm import public_v52\nfrom aasm import public_v53\n',1)
          old='def test_v52_active_release_binds_demo_stack_to_v52_runtime():\n    assert demo_stack.AASMEngine is public_v52.AASMEngine\n    assert demo_stack._runtime_version() == public_v52.__version__\n'
          new='def test_v52_versioned_parent_remains_frozen_while_demo_stack_tracks_current_v53():\n    assert demo_stack.AASMEngine is public_v53.AASMEngine\n    assert demo_stack._runtime_version() == public_v53.__version__\n'
          if old not in s: raise SystemExit('test_v52_public demo binding drift')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('tests/test_v53_public.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('PUBLIC_RELEASE_STABILITY == "PRE_RELEASE"','PUBLIC_RELEASE_STABILITY == "ACTIVE_DEVELOPMENT"')
          old='def test_pre_release_v53_import_does_not_rebind_active_v52_demo_stack():\n    assert demo_stack.AASMEngine is public_v52.AASMEngine\n    assert demo_stack._runtime_version() == "0.52.0"\n'
          new='def test_active_v53_release_binds_demo_stack_to_v53_runtime():\n    assert demo_stack.AASMEngine is public_v53.AASMEngine\n    assert demo_stack._runtime_version() == "0.53.0"\n'
          if old not in s: raise SystemExit('test_v53_public demo binding drift')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          python -m compileall -q src tests scripts
          git rm .github/workflows/promote-v53-mechanical-once.yml
          python scripts/release_manifest.py --write-file-list
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare AASM v0.53.0 release surfaces'
          git push origin HEAD:main
