name: AASM Engineering Degraded Operation Public Candidate Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-engineering-degraded-operation-public-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  engineering-degraded-operation-public:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AASM development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile degraded-operation public candidate and foundation
        run: |
          python -m compileall -q \
            src/aasm/degraded_operation.py \
            src/aasm/public_active_degraded_operation.py \
            scripts/check_degraded_operation_contracts.py \
            scripts/check_degraded_operation_public_candidate.py \
            tests/test_degraded_operation_foundation.py \
            tests/test_degraded_operation_public_candidate.py
          python -m json.tool schemas/degraded-operation.schema.json >/dev/null
          python -m json.tool schemas/degraded-operation-assessment.schema.json >/dev/null
      - name: Check degraded-operation foundation firewalls
        run: python scripts/check_degraded_operation_contracts.py
      - name: Check 0.32.20 public candidate firewalls
        run: python scripts/check_degraded_operation_public_candidate.py
      - name: Run degraded-operation foundation and public candidate corpus
        run: |
          pytest -q \
            tests/test_degraded_operation_foundation.py \
            tests/test_degraded_operation_public_candidate.py
      - name: Publish degraded-operation public candidate qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='S4.5 degraded-operation public candidate 0.32.20 passed'
          else
            state=failure
            description='S4.5 degraded-operation public candidate 0.32.20 failed'
          fi
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context='aasm/engineering-degraded-operation-public' \
              -f description="$description" \
              -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          echo 'failed to publish aasm/engineering-degraded-operation-public after bounded retries' >&2
          exit 1
