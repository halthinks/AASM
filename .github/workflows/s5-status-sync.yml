name: One-shot S5.4 status sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/s5-status-sync.yml

permissions:
  contents: write

jobs:
  sync-status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Synchronize README and canonical roadmap
        shell: python
        run: |
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          replacements = {
              "**Qualified development boundary:** PR-1 + PR-2 + complete PR-3 / PHY-01 + complete S3 + active S4 public lineage through Degraded Operation 0.32.20, with Risk/Irreversibility, Obligation Phases, Safety Envelope/Hybrid State, and Epistemic Debt/Manual Override gated pre-admission foundations":
                  "**Qualified development boundary:** PR-1 + PR-2 + complete PR-3 / PHY-01 + complete S3 + active S4 public lineage through Degraded Operation 0.32.20 + complete S5.1-S5.4 pre-admission foundations, with S5.4 Knowledge Applicability/Application qualified under `aasm/knowledge-applicability`",
              "**Next unfinished boundary:** S5.1 — governed Refinement Proposal/Loop with evaluator/proposer authority separation":
                  "**Next unfinished boundary:** S5.5 — Integrated Core/Conflict Pipeline",
              "**Latest fully qualified pre-documentation implementation head:** `7c808fc504fa91edb8fe9af13f12568b745f9762`":
                  "**Latest fully qualified pre-documentation implementation head:** `95a73f543fa7303fe420ad145af83fb106c5787b`",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"README status anchor missing: {old}")
          readme.write_text(text, encoding="utf-8")

          roadmap = Path("docs/roadmaps/GOVERNED_SEMANTIC_EVOLUTION_ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          old_next = "**Next seam:** S5.1 governed Refinement Proposal/Loop foundation."
          new_next = "**Next seam:** S5.5 integrated core/conflict pipeline after implemented S5.1-S5.4 foundations."
          if old_next in text:
              text = text.replace(old_next, new_next, 1)
          elif new_next not in text:
              raise SystemExit("roadmap S4 next-seam anchor missing")
          heading = "## 5.4 Knowledge applicability/application\n"
          status = "\n**Status: FOUNDATION IMPLEMENTED AND QUALIFIED; durable pre-admission runtime active under `aasm/knowledge-applicability`. Public admission remains `PRE_ADMISSION_ONLY`.**\n"
          if status.strip() not in text:
              if heading not in text:
                  raise SystemExit("roadmap S5.4 heading missing")
              text = text.replace(heading, heading + status, 1)
          roadmap.write_text(text, encoding="utf-8")
      - name: Commit synchronized status
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md docs/roadmaps/GOVERNED_SEMANTIC_EVOLUTION_ROADMAP.md; then
            echo 'status already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/roadmaps/GOVERNED_SEMANTIC_EVOLUTION_ROADMAP.md
          git commit -m 'Synchronize README and roadmap after S5.4 qualification'
          git push origin HEAD:main
