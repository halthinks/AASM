name: AASM Engineering Safety Envelope Hybrid State Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-engineering-safety-envelope-hybrid-state-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  engineering-safety-envelope-hybrid-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AASM development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile safety-envelope/hybrid-state foundation and source firewall
        run: |
          python -m compileall -q \
            src/aasm/safety_envelope_hybrid_state.py \
            src/aasm/_safety_envelope_common.py \
            src/aasm/_safety_envelope_records.py \
            src/aasm/_hybrid_state_records.py \
            src/aasm/_safety_envelope_assessment_records.py \
            src/aasm/_safety_envelope_validation.py \
            src/aasm/_safety_envelope_evaluation.py \
            scripts/check_safety_envelope_hybrid_state_contracts.py \
            tests/test_safety_envelope_hybrid_state_foundation.py
          python -m json.tool schemas/safety-envelope.schema.json >/dev/null
          python -m json.tool schemas/hybrid-state.schema.json >/dev/null
          python -m json.tool schemas/safety-envelope-assessment.schema.json >/dev/null
      - name: Check safety-envelope/hybrid-state source contracts
        run: python scripts/check_safety_envelope_hybrid_state_contracts.py
      - name: Run safety-envelope/hybrid-state adversarial corpus
        run: pytest -q tests/test_safety_envelope_hybrid_state_foundation.py
      - name: Publish safety-envelope/hybrid-state qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='S4.8 safety-envelope/hybrid-state pre-admission foundation passed'
          else
            state=failure
            description='S4.8 safety-envelope/hybrid-state pre-admission foundation failed'
          fi
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context='aasm/engineering-safety-envelope-hybrid-state' \
              -f description="$description" \
              -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          echo 'failed to publish aasm/engineering-safety-envelope-hybrid-state after bounded retries' >&2
          exit 1
