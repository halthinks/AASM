name: Apply Observation Planning Runtime Integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply observation planning runtime integration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply exact runtime integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/aasm/_runtime_v52_resources.py')
          text = path.read_text()
          old = '''        evidence_id = self._record_resource_document(\n            record_type="observation",\n            object_id=observation_id,\n            document=document,\n            source=RESOURCE_OBSERVATION_CONTRACT_ID,\n        )\n        return {"observation_id": observation_id, "observation": document, "evidence_id": evidence_id}\n'''
          new = '''        evidence_id = self._record_resource_document(\n            record_type="observation",\n            object_id=observation_id,\n            document=document,\n            source=RESOURCE_OBSERVATION_CONTRACT_ID,\n        )\n        capacity.latest_observation = observation\n        capacity_evidence_id = self._record_resource_document(\n            record_type="capacity",\n            object_id=capacity.resource_id,\n            document=_capacity_to_dict(capacity),\n            source=RESOURCE_CAPACITY_CONTRACT_ID,\n            derived_from=[evidence_id],\n        )\n        return {\n            "observation_id": observation_id,\n            "observation": document,\n            "evidence_id": evidence_id,\n            "capacity_evidence_id": capacity_evidence_id,\n        }\n'''
          if old not in text:
              raise SystemExit('observation integration anchor not found')
          text = text.replace(old, new, 1)
          old2 = '            reservation = reserve_candidate_resources(selected, capacities)\n'
          new2 = '            reservation = reserve_candidate_resources(selected, capacities, policy)\n'
          if old2 not in text:
              raise SystemExit('reservation policy anchor not found')
          text = text.replace(old2, new2, 1)
          path.write_text(text)
          PY
          rm .github/workflows/_apply-observation-planning.yml
          python -m compileall -q src/aasm tests
          python scripts/release_manifest.py --check-file-list
      - name: Commit integration to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate observed capacity into durable planning'
          git push origin HEAD:main
