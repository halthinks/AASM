name: Apply v0.53 resource CAS once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply guarded commit and store preconditions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one guarded edit point, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/aasm/engine.py",
              "    def _commit(self,event):\n        self.snapshot=reduce_event(self.snapshot,event)\n        stored=self.store.append(self.snapshot.machine_id,event,self.snapshot)\n        self._sync_after_append()\n        return stored\n",
              "    def _commit(self,event):\n        machine_id=self.snapshot.machine_id\n        prior=deepcopy(self.snapshot)\n        try:\n            self.snapshot=reduce_event(self.snapshot,event)\n            stored=self.store.append(machine_id,event,self.snapshot)\n        except Exception:\n            try:\n                self.snapshot=self.store.load_snapshot(machine_id)\n                self.events=self.store.load_events(machine_id)\n            except Exception:\n                self.snapshot=prior\n            self._refresh_runtime_views()\n            raise\n        self._sync_after_append()\n        return stored\n"
          )
          replace_once(
              "src/aasm/engine.py",
              "    def add_evidence(self,record:EvidenceRecord,*,reason='evidence recorded'):\n        self.evidence_ledger.add(record); self._commit(Event(new_id('evt'),now(),EventType.EVIDENCE_ADDED.value,self.state_value,self.state_value,reason,evidence=[record.evidence_id],data={'record':asdict(record)},machine_id=self.snapshot.machine_id)); return self.evidence_ledger.get(record.evidence_id)\n",
              "    def add_evidence(self,record:EvidenceRecord,*,reason='evidence recorded'):\n        self.evidence_ledger.add(record); self._commit(Event(new_id('evt'),now(),EventType.EVIDENCE_ADDED.value,self.state_value,self.state_value,reason,evidence=[record.evidence_id],data={'record':asdict(record)},machine_id=self.snapshot.machine_id)); return self.evidence_ledger.get(record.evidence_id)\n    def add_evidence_guarded(self,record:EvidenceRecord,*,expected_machine_version:int,reason='guarded evidence recorded'):\n        self.evidence_ledger.add(record); self._commit(Event(new_id('evt'),now(),EventType.EVIDENCE_ADDED.value,self.state_value,self.state_value,reason,evidence=[record.evidence_id],data={'record':asdict(record),'expected_machine_version':int(expected_machine_version)},machine_id=self.snapshot.machine_id)); return self.evidence_ledger.get(record.evidence_id)\n"
          )

          replace_once(
              "src/aasm/persistence/memory.py",
              "            canonical = None if not events else deepcopy(self._snapshots[machine_id])\n            if (\n",
              "            canonical = None if not events else deepcopy(self._snapshots[machine_id])\n            expected_version = stored.data.get(\"expected_machine_version\")\n            if canonical is not None and expected_version is not None and canonical.version != int(expected_version):\n                raise ValueError(f\"Stale machine version: event expected {int(expected_version)}, canonical version is {canonical.version}\")\n            if (\n"
          )
          replace_once(
              "src/aasm/persistence/sqlite.py",
              "                canonical=None if last_sequence==0 else snapshot_from_dict(json.loads(run[\"snapshot_json\"]))\n                event.machine_id=machine_id; event.sequence=last_sequence+1\n                if canonical is not None and event.event_type==EventType.TRANSITION_COMMITTED.value",
              "                canonical=None if last_sequence==0 else snapshot_from_dict(json.loads(run[\"snapshot_json\"]))\n                event.machine_id=machine_id; event.sequence=last_sequence+1\n                expected_version=event.data.get(\"expected_machine_version\")\n                if canonical is not None and expected_version is not None and canonical.version!=int(expected_version): raise ValueError(f\"Stale machine version: event expected {int(expected_version)}, canonical version is {canonical.version}\")\n                if canonical is not None and event.event_type==EventType.TRANSITION_COMMITTED.value"
          )
          replace_once(
              "src/aasm/persistence/postgres.py",
              "                canonical=None if last_sequence==0 else snapshot_from_dict(self._obj(run[0]))\n                event.machine_id=machine_id; event.sequence=last_sequence+1\n                if canonical is not None and event.event_type==EventType.TRANSITION_COMMITTED.value",
              "                canonical=None if last_sequence==0 else snapshot_from_dict(self._obj(run[0]))\n                event.machine_id=machine_id; event.sequence=last_sequence+1\n                expected_version=event.data.get(\"expected_machine_version\")\n                if canonical is not None and expected_version is not None and canonical.version!=int(expected_version): raise ValueError(f\"Stale machine version: event expected {int(expected_version)}, canonical version is {canonical.version}\")\n                if canonical is not None and event.event_type==EventType.TRANSITION_COMMITTED.value"
          )

          replace_once(
              "src/aasm/_runtime_v52_resources.py",
              "        self.add_evidence(\n            EvidenceRecord(\n                kind=\"observation\" if record_type == \"observation\" else \"resource_state\",\n                statement=canonical_semantic_json(payload),\n                source=source,\n                derived_from=list(derived_from),\n                metadata={\n                    _RESOURCE_RECORD_TYPE: record_type,\n                    \"object_id\": object_id,\n                    _RESOURCE_DOCUMENT: payload,\n                    \"authority\": \"EVIDENCE_ONLY\",\n                },\n                evidence_id=evidence_id,\n            ),\n            reason=f\"resource {record_type} recorded\",\n        )\n",
              "        record = EvidenceRecord(\n            kind=\"observation\" if record_type == \"observation\" else \"resource_state\",\n            statement=canonical_semantic_json(payload),\n            source=source,\n            derived_from=list(derived_from),\n            metadata={\n                _RESOURCE_RECORD_TYPE: record_type,\n                \"object_id\": object_id,\n                _RESOURCE_DOCUMENT: payload,\n                \"authority\": \"EVIDENCE_ONLY\",\n            },\n            evidence_id=evidence_id,\n        )\n        if getattr(self, \"_guard_resource_evidence_by_version\", False):\n            self.add_evidence_guarded(record, expected_machine_version=self.snapshot.version, reason=f\"resource {record_type} recorded\")\n        else:\n            self.add_evidence(record, reason=f\"resource {record_type} recorded\")\n"
          )

          replace_once(
              "src/aasm/runtime_v53.py",
              "class AASMEngine(ScopedAuthorityRuntimeMixin, V52Engine):\n    \"\"\"Experimental v0.53 runtime: scoped identity/authority enforced over v0.52.\"\"\"\n",
              "class AASMEngine(ScopedAuthorityRuntimeMixin, V52Engine):\n    \"\"\"Experimental v0.53 runtime: scoped identity/authority enforced over v0.52.\"\"\"\n\n    _guard_resource_evidence_by_version = True\n"
          )
          PY
          python -m compileall -q src/aasm/engine.py src/aasm/persistence src/aasm/_runtime_v52_resources.py src/aasm/runtime_v53.py
          git rm .github/workflows/apply-v53-resource-cas-once.yml
          python scripts/release_manifest.py --write-file-list
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/aasm/engine.py src/aasm/persistence/memory.py src/aasm/persistence/sqlite.py src/aasm/persistence/postgres.py src/aasm/_runtime_v52_resources.py src/aasm/runtime_v53.py FILE_LIST.txt
          git commit -m 'Fail stale v0.53 resource commits closed across stores'
          git push origin HEAD:main
