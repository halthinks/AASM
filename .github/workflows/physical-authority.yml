name: Physical Authority Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  physical_authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install physical authority dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile physical authority foundation
        run: python -m compileall -q src/aasm/physical_authority.py src/aasm/physical_authority_runtime.py tests/test_physical_authority.py scripts/check_physical_authority_contracts.py
      - name: Validate physical authority source contracts
        run: python scripts/check_physical_authority_contracts.py
      - name: Run physical authority adversarial and replay tests
        run: pytest -q tests/test_physical_authority.py
      - name: Publish Physical Authority status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='authority domains, exclusive epochs, revocation, replay, and no-effect-authority boundary passed'
          else
            state=failure
            description='physical authority foundation qualification failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context='aasm/physical-authority' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
