name: AASM Verification Planning Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-verification-planning-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verification-planning:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AASM development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile S5.3 verification planning foundation, assurance, and lifecycle
        run: |
          python -m compileall -q \
            src/aasm/verification_planning.py \
            src/aasm/verification_planning_assurance.py \
            src/aasm/verification_planning_lifecycle.py \
            scripts/check_verification_planning_contracts.py \
            scripts/check_verification_planning_assurance_contracts.py \
            scripts/check_verification_planning_lifecycle_contracts.py \
            tests/test_verification_planning_foundation.py \
            tests/test_verification_planning_assurance.py \
            tests/test_verification_planning_lifecycle.py
          python -m json.tool schemas/verification-plan.schema.json >/dev/null
          python -m json.tool schemas/verification-debt.schema.json >/dev/null
      - name: Check S5.3 semantic, assurance, lifecycle, and pre-admission firewalls
        run: |
          python scripts/check_verification_planning_contracts.py
          python scripts/check_verification_planning_assurance_contracts.py
          python scripts/check_verification_planning_lifecycle_contracts.py
      - name: Run S5.3 adversarial verification-planning corpus
        run: |
          pytest -q \
            tests/test_verification_planning_foundation.py \
            tests/test_verification_planning_assurance.py \
            tests/test_verification_planning_lifecycle.py
      - name: Publish S5.3 verification-planning qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='S5.3 verification plan/debt foundation, assurance, and lifecycle passed'
          else
            state=failure
            description='S5.3 verification plan/debt foundation, assurance, or lifecycle failed'
          fi
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context='aasm/verification-planning' \
              -f description="$description" \
              -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          echo 'failed to publish aasm/verification-planning after bounded retries' >&2
          exit 1
