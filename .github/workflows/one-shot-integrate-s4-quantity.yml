name: One-shot S4 quantity cumulative integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-integrate-s4-quantity.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Align active quantity admission and cumulative source contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def one(path, old, new, label):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor in {path}, found {count}')
              p.write_text(text.replace(old,new,1), encoding='utf-8')
              print(f'{path}: {label}')

          # Public admission is qualified; runtime/state admission remains absent.
          one(
              'scripts/check_quantity_contracts.py',
              '    for active_source, label in (\n        (foundation, "runtime_v56_foundation"),\n        (public, "active public overlay"),\n        (package_init, "package root"),\n    ):',
              '    for active_source, label in (\n        (foundation, "runtime_v56_foundation"),\n        (public, "qualified 0.32.15 parent"),\n    ):',
              'separate public admission from runtime pre-admission',
          )

          # Existing v56 integration tests must follow the active adoption root.
          p=Path('tests/test_v56_public_candidate.py'); text=p.read_text(encoding='utf-8')
          count=text.count('0.32.15')
          if count != 2:
              raise SystemExit(f'v56 public fixture: expected 2 active-adoption assertions, found {count}')
          p.write_text(text.replace('0.32.15','0.32.16'), encoding='utf-8')
          print('tests/test_v56_public_candidate.py: 0.32.16 active adoption')

          # Extend the cumulative release/source checker additively.
          p=Path('scripts/check_release_contracts.py'); text=p.read_text(encoding='utf-8')
          replacements=[
              (
                  'require(root / "src/aasm/__init__.py", ["public_v56", "public_active", "public_active_entity_evolution"])',
                  'require(root / "src/aasm/__init__.py", ["public_v56", "public_active", "public_active_entity_evolution", "public_active_engineering_quantity"])',
                  'package root quantity overlay',
              ),
              (
                  '    require(root / "src/aasm/runtime_v56_foundation.py", [',
                  '    require(root / "src/aasm/public_active_engineering_quantity.py", [\n        \'"contract_version": "0.32.16"\',\n        "QUANTITY_CONTRACT_ID",\n        "Quantity",\n        "quantity_contract",\n        \'"engineering-quantity"\',\n        \'"public_admission": "QUALIFIED"\',\n        \'"engine_state_integration": "NONE_SEMANTIC_VALUE_FOUNDATION_ONLY"\',\n    ])\n    require(root / "src/aasm/quantity.py", [\n        \'QUANTITY_CONTRACT_ID = "aasm.quantity.v1"\',\n        \'"PRE_ADMISSION_ONLY"\',\n        \'"NONE_HIDDEN_OR_MUTABLE"\',\n        \'"UNCHANGED_NOT_REINTERPRETED_BY_QUANTITY_FOUNDATION"\',\n    ])\n    require(root / "src/aasm/runtime_v56_foundation.py", [',
                  'quantity source/public contract',
              ),
              (
                  '        "check_entity_evolution_contracts.py",\n    ):',
                  '        "check_entity_evolution_contracts.py",\n        "check_quantity_contracts.py",\n        "check_quantity_public.py",\n    ):',
                  'quantity nested checkers',
              ),
              (
                  '        "entity-evolution.schema.json",\n    ):',
                  '        "entity-evolution.schema.json",\n        "quantity.schema.json",\n    ):',
                  'quantity schema coverage',
              ),
              (
                  '        "tests/test_entity_evolution_public.py",\n        "0.32.15",\n        "context=\'aasm/v56\'",',
                  '        "tests/test_entity_evolution_public.py",\n        "check_quantity_contracts.py",\n        "check_quantity_public.py",\n        "tests/test_quantity_foundation.py",\n        "tests/test_quantity_public.py",\n        "0.32.16",\n        "context=\'aasm/v56\'",',
                  'cumulative v56 quantity coverage',
              ),
              (
                  '        "aasm/entity-evolution",\n        "check_version_policy.py",',
                  '        "aasm/entity-evolution",\n        "aasm/engineering-quantity",\n        "check_version_policy.py",',
                  'release quantity context',
              ),
              (
                  '        "assert c[\'contract_version\']==\'0.32.15\'; "',
                  '        "assert c[\'contract_version\']==\'0.32.16\'; "',
                  'runtime adoption assertion',
              ),
              (
                  "        \"assert all(k in c for k in ('physical_effect_integration','state_conflict','event_causality','observation_freshness','physical_identity','calibration','source_trust','execution_environment','observation_processing','artifact_lineage','entity_evolution'))\"",
                  "        \"assert all(k in c for k in ('physical_effect_integration','state_conflict','event_causality','observation_freshness','physical_identity','calibration','source_trust','execution_environment','observation_processing','artifact_lineage','entity_evolution','engineering_quantity'))\"",
                  'runtime quantity public contract key',
              ),
              (
                  'print("0.56.1 development target + active adoption 0.32.15 + PR-3 + S3 observation/artifact/entity source/release contracts: PASS")',
                  'print("0.56.1 development target + active adoption 0.32.16 + PR-3 + S3 + S4 quantity source/release contracts: PASS")',
                  'release checker label',
              ),
          ]
          for old,new,label in replacements:
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'check_release_contracts.py {label}: expected 1 anchor, found {count}')
              text=text.replace(old,new,1)
          p.write_text(text, encoding='utf-8')
          print('scripts/check_release_contracts.py: S4 quantity integrated')
          PY
          python -m compileall -q scripts/check_quantity_contracts.py scripts/check_release_contracts.py tests/test_v56_public_candidate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check_quantity_contracts.py scripts/check_release_contracts.py tests/test_v56_public_candidate.py
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate qualified quantity into cumulative source contracts'
          git push origin HEAD:main
