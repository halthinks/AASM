name: One-shot S4.10 Atomic Safety Governance Implementation

on:
  push:
    branches: [main]

concurrency:
  group: aasm-one-shot-semantic-advance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  advance-s410:
    if: github.event.head_commit.message == 'Execute atomic S4.10 safety-governance implementation'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install complete development dependencies
        run: python -m pip install -e '.[dev,optimization]'
      - name: Materialize permanent TextPCB corpus and aggregate gate
        run: python .github/s410_payload.py
      - name: Normalize new Python qualification surfaces
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            tests/test_textpcb_s4_safety_governance.py
            scripts/check_safety_governance_contracts.py
            scripts/check_s410_release_contracts.py
          )
          ruff check --fix "${paths[@]}" || true
          ruff format "${paths[@]}"
          ruff check "${paths[@]}"
      - name: Remove one-shot transport files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/s410_payload.py \
            .github/workflows/advance-s410.yml \
            .github/s49_payload.py \
            .github/workflows/advance-s49.yml \
            .github/workflows/repair-s48-ci.yml
      - name: Validate manifest, schema, and source contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            tests/test_textpcb_s4_safety_governance.py \
            scripts/check_safety_governance_contracts.py \
            scripts/check_s410_release_contracts.py
          python -m json.tool fixtures/textpcb/s4-safety-governance-fixtures.json >/dev/null
          python -m json.tool schemas/textpcb-s4-safety-fixture.schema.json >/dev/null
          python scripts/check_safety_governance_contracts.py
          pytest -q tests/test_textpcb_s4_safety_governance.py
      - name: Re-run every S4 foundation and public corpus
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_quantity_contracts.py
          python scripts/check_quantity_public.py
          python scripts/check_rule_contracts.py
          python scripts/check_rule_public.py
          python scripts/check_semantic_projection_contracts.py
          python scripts/check_semantic_projection_public.py
          python scripts/check_uncertainty_scenario_trace_contracts.py
          python scripts/check_uncertainty_scenario_trace_public.py
          python scripts/check_degraded_operation_contracts.py
          python scripts/check_degraded_operation_public.py
          python scripts/check_risk_irreversibility_contracts.py
          python scripts/check_obligation_phase_contracts.py
          python scripts/check_safety_envelope_hybrid_state_contracts.py
          python scripts/check_epistemic_debt_manual_override_contracts.py
          pytest -q \
            tests/test_quantity_foundation.py \
            tests/test_quantity_public.py \
            tests/test_rule_foundation.py \
            tests/test_rule_public.py \
            tests/test_semantic_projection_foundation.py \
            tests/test_semantic_projection_textpcb.py \
            tests/test_semantic_projection_adversarial.py \
            tests/test_semantic_projection_public.py \
            tests/test_uncertainty_scenario_trace_foundation.py \
            tests/test_uncertainty_scenario_trace_public.py \
            tests/test_degraded_operation_foundation.py \
            tests/test_degraded_operation_public.py \
            tests/test_risk_irreversibility_foundation.py \
            tests/test_obligation_phase_foundation.py \
            tests/test_safety_envelope_hybrid_state_foundation.py \
            tests/test_epistemic_debt_manual_override_foundation.py \
            tests/test_textpcb_s4_safety_governance.py
      - name: Enforce release inventory and all cumulative firewalls
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_manifest.py --check-file-list
          python scripts/check_release_contracts.py
          python scripts/check_s48_release_contracts.py
          python scripts/check_s49_release_contracts.py
          python scripts/check_s410_release_contracts.py
          python scripts/check_version_policy.py
          changed_python="$(git diff --name-only -- '*.py' | tr '\n' ' ')"
          if [ -n "$changed_python" ]; then ruff check $changed_python; fi
          git diff --check
      - name: Commit and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement S4.10 permanent safety governance corpus'
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            git rebase origin/main
            python scripts/release_manifest.py --check-file-list
            python scripts/check_release_contracts.py
            python scripts/check_s48_release_contracts.py
            python scripts/check_s49_release_contracts.py
            python scripts/check_s410_release_contracts.py
            python scripts/check_safety_governance_contracts.py
            pytest -q tests/test_textpcb_s4_safety_governance.py
          fi
          git push origin HEAD:main
