name: Clean final v0.53 inventory entry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Delete helper before canonical inventory generation
        run: |
          set -euo pipefail
          git rm .github/workflows/cleanup-v53-inventory-once.yml
          python scripts/release_manifest.py --write-file-list
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FILE_LIST.txt
          git commit -m 'Clean final stale v0.53 inventory entry'
          git push origin HEAD:main
