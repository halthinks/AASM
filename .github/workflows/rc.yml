name: Semantic Solver RC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  semantic_solver_rc:
    runs-on: ubuntu-24.04
    env:
      AASM_REQUIRE_RC_BACKENDS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install RC and native solver dependencies
        run: python -m pip install -e '.[dev,optimization]'
      - name: Compile v0.49 surface
        run: python -m compileall -q src/aasm/semantic_solver_rc.py src/aasm/_runtime_v49_rc.py src/aasm/runtime_v49.py src/aasm/public_v49.py src/aasm/cli_v49.py tests/test_v49_rc.py tests/test_v49_rc_real.py
      - name: Run dependency-neutral RC assurance
        run: pytest -q tests/test_v49_rc.py
      - name: Run real cross-backend and benchmark certification
        run: pytest -q tests/test_v49_rc_real.py
      - name: Run complete RC certification report
        run: |
          python - <<'PY'
          import json
          from aasm import public_api_contract
          from aasm.runtime_v49 import AASMEngine
          from aasm.semantic_solver_rc import run_semantic_solver_rc_certification
          report = run_semantic_solver_rc_certification(real=True, target_engine_cls=AASMEngine, public_contract=public_api_contract())
          print(json.dumps(report, sort_keys=True))
          if report["status"] != "PASS":
              raise SystemExit(1)
          if report["freeze_manifest"]["runtime_version"] != "0.53.0":
              raise SystemExit("RC freeze manifest is not the current v0.53 public contract")
          if report["freeze_manifest"]["adoption_contract_version"] != "0.29.0":
              raise SystemExit("RC freeze manifest is not the current v0.53 adoption contract")
          PY
      - name: Run public RC CLI surfaces
        run: |
          aasm semantic-solver-rc-contract >/tmp/rc-contract.json
          aasm semantic-solver-rc-freeze >/tmp/rc-freeze.json
          aasm semantic-solver-rc-upgrade >/tmp/rc-upgrade.json
          aasm semantic-solver-rc-cross-backend --real >/tmp/rc-overlap.json
          aasm semantic-solver-rc-benchmark --real --iterations 8 >/tmp/rc-benchmark.json
          aasm semantic-solver-rc-claim-audit >/tmp/rc-claims.json
          aasm semantic-solver-rc-certify --real >/tmp/rc-certification.json
          python - <<'PY'
          import json
          for path in ("/tmp/rc-contract.json", "/tmp/rc-freeze.json", "/tmp/rc-upgrade.json", "/tmp/rc-overlap.json", "/tmp/rc-benchmark.json", "/tmp/rc-claims.json", "/tmp/rc-certification.json"):
              with open(path, encoding="utf-8") as handle:
                  json.load(handle)
          PY
      - name: Publish Semantic Solver RC status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='semantic solver RC compatibility, real-backend certification, benchmarks, and claim audit passed'
          else
            state=failure
            description='semantic solver RC gate failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context='aasm/semantic-solver-rc' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
