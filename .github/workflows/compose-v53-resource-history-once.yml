name: Compose v0.53 resource history once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compose projection mixin and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/aasm/runtime_v53.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from ._runtime_v53_authority import ScopedAuthorityRuntimeMixin\n"
          new_import = "from ._runtime_v53_authority import ScopedAuthorityRuntimeMixin\nfrom ._runtime_v53_resource_history import PrincipalAwareResourceHistoryMixin\n"
          if text.count(old_import) != 1:
              raise SystemExit("runtime_v53 authority import drift")
          text = text.replace(old_import, new_import)
          old_class = "class AASMEngine(ScopedAuthorityRuntimeMixin, V52Engine):\n"
          new_class = "class AASMEngine(PrincipalAwareResourceHistoryMixin, ScopedAuthorityRuntimeMixin, V52Engine):\n"
          if text.count(old_class) != 1:
              raise SystemExit("runtime_v53 class composition drift")
          path.write_text(text.replace(old_class, new_class), encoding="utf-8")
          PY
          python -m compileall -q src/aasm/runtime_v53.py src/aasm/_runtime_v53_resource_history.py src/aasm/scoped_store.py
          git rm .github/workflows/compose-v53-resource-history-once.yml
          python scripts/release_manifest.py --write-file-list
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/aasm/runtime_v53.py src/aasm/_runtime_v53_resource_history.py src/aasm/scoped_store.py schemas/scoped-store-access.schema.json tests/test_v53_scoped_store.py FILE_LIST.txt
          git commit -m 'Compose principal-aware resource history and scoped store foundation'
          git push origin HEAD:main
