name: AASM Engineering Risk and Irreversibility Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-engineering-risk-irreversibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  engineering-risk-irreversibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AASM development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile S4.6 risk and irreversibility foundation
        run: |
          python -m compileall -q \
            src/aasm/risk_irreversibility.py \
            scripts/check_risk_irreversibility_contracts.py \
            tests/test_risk_irreversibility_foundation.py
          python -m json.tool schemas/risk-envelope.schema.json >/dev/null
          python -m json.tool schemas/effect-irreversibility.schema.json >/dev/null
          python -m json.tool schemas/irreversibility-assurance-policy.schema.json >/dev/null
          python -m json.tool schemas/risk-assessment.schema.json >/dev/null
      - name: Check S4.6 source and pre-admission firewalls
        run: python scripts/check_risk_irreversibility_contracts.py
      - name: Run S4.6 adversarial foundation corpus
        run: pytest -q tests/test_risk_irreversibility_foundation.py
      - name: Publish S4.6 qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='S4.6 risk/irreversibility pre-admission foundation passed'
          else
            state=failure
            description='S4.6 risk/irreversibility foundation failed'
          fi
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context='aasm/engineering-risk-irreversibility' \
              -f description="$description" \
              -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          echo 'failed to publish aasm/engineering-risk-irreversibility after bounded retries' >&2
          exit 1
