name: AASM Physical Effect Integration Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-physical-effect-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  physical-effect-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install qualification dependencies
        run: python -m pip install -e '.[dev,optimization]'
      - name: Check PR-3H source contracts
        run: python scripts/check_physical_effect_integration_contracts.py
      - name: Run PR-3H adversarial and replay fixtures
        run: pytest -q tests/test_physical_effect_integration.py
      - name: Publish physical effect integration qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='PR-3H physical effect integration qualification passed'
          else
            state=failure
            description='PR-3H physical effect integration qualification failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='aasm/physical-effect-integration' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
