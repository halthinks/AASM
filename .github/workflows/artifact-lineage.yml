name: AASM Artifact Lineage Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-artifact-lineage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  artifact-lineage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AASM development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check artifact lineage active-engine candidate contracts
        run: python scripts/check_artifact_lineage_contracts.py
      - name: Run artifact lineage foundation, real-engine runtime, and adversarial fixtures
        run: pytest -q tests/test_artifact_lineage_*.py
      - name: Publish artifact lineage qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='S3 artifact revision active-engine candidate qualification passed'
          else
            state=failure
            description='S3 artifact revision active-engine candidate qualification failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='aasm/artifact-lineage' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
