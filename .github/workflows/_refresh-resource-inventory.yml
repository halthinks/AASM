name: Refresh Resource Runtime Inventory

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Refresh v0.52 resource runtime inventory'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Remove one-shot workflow and regenerate canonical inventory
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_refresh-resource-inventory.yml
          python scripts/release_manifest.py --write-file-list
          python scripts/release_manifest.py --check-file-list
      - name: Commit canonical inventory to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Regenerate resource runtime inventory'
          git push origin HEAD:main
