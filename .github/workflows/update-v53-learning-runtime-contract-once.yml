name: Align v0.53 learning runtime contract once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Update runtime contract and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/aasm/_runtime_v53_solver_learning.py")
          text = path.read_text(encoding="utf-8")
          old_map = '''SOLVER_LEARNING_AUTHORITY_CAPABILITIES = {
              "export": "solver.learning.export",
              "import": "solver.learning.import",
              "validate": "solver.learning.validate",
          }'''.replace('          ', '')
          new_map = '''SOLVER_LEARNING_AUTHORITY_CAPABILITIES = {
              "export": "solver.learning.export",
              "import": "solver.learning.import",
              "validate": "solver.learning.validate",
              "apply": "solver.learning.apply",
          }'''.replace('          ', '')
          if text.count(old_map) != 1:
              raise SystemExit(f"authority capability map drift: {text.count(old_map)}")
          text = text.replace(old_map, new_map)
          old_application = '        "application": "NO_AUTOMATIC_APPLICATION_IN_V0.53_FOUNDATION",\n'
          new_application = (
              '        "application": "EXPLICIT_VALIDATED_ADAPTER_APPLICATION_ONLY",\n'
              '        "apply_authority": "SCOPED_SOLVER_LEARNING_APPLY_REQUIRED",\n'
              '        "truth_authority": "NONE",\n'
              '        "policy_authority": "NONE",\n'
              '        "solver_execution": "EXISTING_AASM_OPTIMIZATION_PROVIDER_PATH_ONLY",\n'
          )
          if text.count(old_application) != 1:
              raise SystemExit(f"runtime application contract drift: {text.count(old_application)}")
          path.write_text(text.replace(old_application, new_application), encoding="utf-8")
          PY
          python -m compileall -q src/aasm/_runtime_v53_solver_learning.py
          git rm .github/workflows/update-v53-learning-runtime-contract-once.yml
          python scripts/release_manifest.py --write-file-list
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/aasm/_runtime_v53_solver_learning.py FILE_LIST.txt
          git commit -m 'Align v0.53 solver learning runtime with explicit application'
          git push origin HEAD:main
