name: AASM Entity Evolution Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-entity-evolution-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  entity-evolution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AASM development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile entity evolution contract runtime and corpora
        run: |
          python -m compileall -q \
            src/aasm/entity_evolution.py \
            src/aasm/entity_evolution_runtime.py \
            src/aasm/runtime_v56_foundation.py \
            tests/test_entity_evolution.py \
            tests/test_entity_evolution_active_engine.py \
            scripts/check_entity_evolution_contracts.py
      - name: Check entity evolution source firewall
        run: python scripts/check_entity_evolution_contracts.py
      - name: Run entity evolution pre-admission adversarial corpus
        run: pytest -q tests/test_entity_evolution.py
      - name: Run identical corpus against exported AASMEngine
        run: pytest -q tests/test_entity_evolution_active_engine.py
      - name: Publish entity evolution qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='S3 entity evolution active-engine qualification passed'
          else
            state=failure
            description='S3 entity evolution active-engine qualification failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='aasm/entity-evolution' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
