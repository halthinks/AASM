name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact main commit to release; defaults to main"
        required: false
        type: string
      publish_pypi:
        description: "Publish through the configured PyPI Trusted Publisher"
        required: false
        default: false
        type: boolean

concurrency:
  group: aasm-release
  cancel-in-progress: false

permissions: {}

jobs:
  release_intent:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      should_release: ${{ steps.intent.outputs.should_release }}
      version: ${{ steps.intent.outputs.version }}
      tag: ${{ steps.intent.outputs.tag }}
      commit_sha: ${{ steps.intent.outputs.commit_sha }}
    steps:
      - name: Resolve release commit
        id: source
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [ -n "${WORKFLOW_RUN_SHA:-}" ]; then ref="$WORKFLOW_RUN_SHA"
          elif [ -n "${MANUAL_SHA:-}" ]; then ref="$MANUAL_SHA"
          else ref="main"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Resolve release intent
        id: intent
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          version="$(python scripts/release_artifacts.py version)"
          tag="v$version"
          previous_version=""
          if git cat-file -e HEAD^:pyproject.toml 2>/dev/null; then
            git show HEAD^:pyproject.toml > /tmp/aasm-prev.toml
            previous_version="$(python -c 'import tomllib; print(tomllib.load(open("/tmp/aasm-prev.toml","rb"))["project"]["version"])')"
          fi
          release_exists=false
          if gh release view "$tag" >/dev/null 2>&1; then release_exists=true; fi
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$version" != "$previous_version" ] || [ "$release_exists" != true ]; then
            should_release=true
          else
            should_release=false
          fi
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

  no_release:
    needs: release_intent
    if: needs.release_intent.outputs.should_release != 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish no-release status
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.release_intent.outputs.commit_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$COMMIT_SHA" \
            -f state=success -f context='aasm/release' \
            -f description='no package version change; release not required' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  build_release:
    needs: release_intent
    if: needs.release_intent.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      statuses: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_intent.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Require exact main commit and all release gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          test "$commit_sha" = "$(git rev-parse origin/main)"
          for context in aasm/ci-summary aasm/formal-assurance aasm/semantic-solver-rc aasm/proof-claims; do
            state=""
            for _ in $(seq 1 90); do
              state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit_sha/status" --jq "[.statuses[] | select(.context == \"$context\")][0].state // \"\"")"
              [ "$state" = success ] && break
              if [ "$state" = failure ] || [ "$state" = error ]; then exit 1; fi
              sleep 10
            done
            test "$state" = success
          done

      - name: Build and verify two byte-identical distributions
        id: release
        shell: bash
        run: |
          set -euo pipefail
          normalize_sdist() {
            python - "$1" "$SOURCE_DATE_EPOCH" <<'PY'
          from __future__ import annotations
          import copy, gzip, io, os, sys, tarfile, tempfile
          from pathlib import Path
          dist_dir=Path(sys.argv[1]); epoch=int(sys.argv[2])
          sdists=sorted(dist_dir.glob("*.tar.gz"))
          if len(sdists)!=1: raise SystemExit(f"expected one sdist in {dist_dir}: {sdists}")
          sdist=sdists[0]
          with tarfile.open(sdist,"r:gz") as source:
              members=[]
              for original in source.getmembers():
                  payload=None
                  if original.isfile():
                      extracted=source.extractfile(original)
                      if extracted is None: raise SystemExit(f"cannot read {original.name}")
                      payload=extracted.read()
                  members.append((original,payload))
          def mode(member):
              if member.isdir(): return 0o755
              if member.issym() or member.islnk(): return 0o777
              return 0o755 if member.mode & 0o111 else 0o644
          fd,tmp=tempfile.mkstemp(prefix=f".{sdist.name}.",suffix=".tmp",dir=sdist.parent); os.close(fd); tmp=Path(tmp)
          try:
              with tmp.open("wb") as raw:
                  with gzip.GzipFile(filename="",mode="wb",fileobj=raw,compresslevel=9,mtime=epoch) as compressed:
                      with tarfile.open(fileobj=compressed,mode="w",format=tarfile.PAX_FORMAT) as target:
                          for original,payload in sorted(members,key=lambda item:item[0].name):
                              member=copy.copy(original); member.mtime=epoch; member.uid=0; member.gid=0; member.uname=""; member.gname=""; member.mode=mode(member); member.pax_headers={}
                              target.addfile(member,io.BytesIO(payload) if payload is not None else None)
              tmp.replace(sdist)
          finally:
              if tmp.exists(): tmp.unlink()
          PY
          }
          python -m pip install "build==1.5.0" "twine==6.2.0"
          python scripts/release_artifacts.py verify-history release-history.json
          version="$(python scripts/release_artifacts.py version)"; tag="v$version"; commit_sha="$(git rev-parse HEAD)"
          python scripts/release_artifacts.py verify-tag "$tag"
          rm -rf build dist dist-a dist-b *.egg-info src/*.egg-info
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" PYTHONHASHSEED=0
          python -m build --outdir dist-a; normalize_sdist dist-a
          rm -rf build *.egg-info src/*.egg-info
          python -m build --outdir dist-b; normalize_sdist dist-b
          python scripts/release_artifacts.py compare-builds dist-a dist-b
          mv dist-a dist; rm -rf dist-b
          python -m twine check dist/*
          python scripts/release_artifacts.py verify-wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" --expected-version "$version"
          python scripts/release_artifacts.py verify-sdist "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" --expected-version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Build historical release audit and immutable manifests
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          python scripts/release_artifacts.py historical-report release-history.json --repository "$GITHUB_REPOSITORY" --output dist/historical-release-report.json --release-commit "$COMMIT_SHA"
          python scripts/release_artifacts.py manifest dist --checksums dist/SHA256SUMS.txt --json dist/release-manifest.json --commit-sha "$COMMIT_SHA"

      - name: Clean-install and exercise wheel
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python -m venv /tmp/aasm-release-venv
          /tmp/aasm-release-venv/bin/python -m pip install dist/*.whl
          /tmp/aasm-release-venv/bin/python - <<'PY'
          import os, aasm
          assert aasm.__version__ == os.environ["EXPECTED_VERSION"]
          assert aasm.validate_public_api_contract()["valid"]
          PY
          /tmp/aasm-release-venv/bin/aasm adoption-contract >/tmp/adoption.json
          /tmp/aasm-release-venv/bin/aasm runbook history-diagnosis >/tmp/runbook.json

      - name: Publish once and verify every remote asset byte
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" dist/* --target "$COMMIT_SHA" --title "AASM $TAG" --notes-file docs/CURRENT_RELEASE.md
          fi
          verified=false
          for _ in $(seq 1 12); do
            if python scripts/release_artifacts.py verify-github-release "$TAG" dist --repository "$GITHUB_REPOSITORY" --expected-commit "$COMMIT_SHA"; then verified=true; break; fi
            sleep 5
          done
          test "$verified" = true
          gh api "repos/$GITHUB_REPOSITORY/statuses/$COMMIT_SHA" -f state=success -f context='aasm/release' -f description='reproducible build and exact immutable release assets verified' -f target_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - uses: actions/upload-artifact@v7
        with:
          name: aasm-${{ steps.release.outputs.version }}-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  release_failure:
    needs: [release_intent, build_release]
    if: always() && needs.release_intent.outputs.should_release == 'true' && needs.build_release.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish failed release status
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.release_intent.outputs.commit_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$COMMIT_SHA" -f state=failure -f context='aasm/release' -f description='release build, verification, or publication failed' -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  publish_pypi:
    needs: [release_intent, build_release]
    if: needs.build_release.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.publish_pypi) || vars.AASM_PUBLISH_PYPI == 'true')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aasm-runtime/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aasm-${{ needs.build_release.outputs.version }}-distributions
          path: dist
      - name: Keep only Python distributions
        run: find dist -maxdepth 1 -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
