name: Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact main commit to release; defaults to main"
        required: false
        type: string
      confirm_release:
        description: "I intend to create/publish this package release"
        required: true
        default: false
        type: boolean
      publish_pypi:
        description: "Publish through the configured PyPI Trusted Publisher"
        required: false
        default: false
        type: boolean

concurrency:
  group: aasm-release
  cancel-in-progress: false

permissions: {}

jobs:
  release_intent:
    if: inputs.confirm_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      version: ${{ steps.intent.outputs.version }}
      tag: ${{ steps.intent.outputs.tag }}
      commit_sha: ${{ steps.intent.outputs.commit_sha }}
    steps:
      - name: Resolve deliberate release commit
        id: source
        shell: bash
        env:
          MANUAL_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_SHA:-}" ]; then ref="$MANUAL_SHA"; else ref="main"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Resolve release identity
        id: intent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          test "$commit_sha" = "$(git rev-parse origin/main)"
          version="$(python scripts/release_artifacts.py version)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; published versions are immutable" >&2
            exit 1
          fi
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build_release:
    needs: release_intent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      statuses: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_intent.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Require exact main commit and all qualification gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          test "$commit_sha" = "$(git rev-parse origin/main)"
          for context in \
            aasm/ci-summary \
            aasm/formal-assurance \
            aasm/semantic-solver-rc \
            aasm/proof-claims \
            aasm/solution-pools \
            aasm/optimization \
            aasm/scoped-authority \
            aasm/solver-learning \
            aasm/v54 \
            aasm/v55 \
            aasm/v56 \
            aasm/v56-provenance \
            aasm/state-authority \
            aasm/external-machine \
            aasm/machine-transition \
            aasm/machine-postcondition \
            aasm/physical-authority \
            aasm/effect-capability \
            aasm/physical-control-fencing \
            aasm/physical-preemption-recovery \
            aasm/physical-effect-integration \
            aasm/identity-calibration-trust \
            aasm/execution-environment \
            aasm/observation-epistemics \
            aasm/artifact-lineage \
            aasm/entity-evolution \
            aasm/engineering-quantity \
            aasm/engineering-rule \
            aasm/engineering-semantic-projection \
            aasm/engineering-semantic-projection-public \
            aasm/engineering-uncertainty-scenario-trace \
            aasm/engineering-uncertainty-scenario-trace-public \
            aasm/engineering-degraded-operation \
            aasm/engineering-degraded-operation-public \
            aasm/engineering-s4 \
            aasm/physical-evidence; do
            state=""
            for _ in $(seq 1 90); do
              state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit_sha/status" --jq "[.statuses[] | select(.context == \"$context\")][0].state // \"\"")"
              [ "$state" = success ] && break
              if [ "$state" = failure ] || [ "$state" = error ]; then exit 1; fi
              sleep 10
            done
            test "$state" = success
          done
      - name: Enforce release identity and strict tracked-file inventory
        run: |
          python scripts/check_version_policy.py
          python scripts/release_manifest.py --check-file-list
          python scripts/check_release_contracts.py
      - name: Build and verify two byte-identical distributions
        id: release
        shell: bash
        run: |
          set -euo pipefail
          normalize_sdist() {
            python - "$1" "$SOURCE_DATE_EPOCH" <<'PY'
          from __future__ import annotations
          import copy, gzip, io, os, sys, tarfile, tempfile
          from pathlib import Path
          dist_dir=Path(sys.argv[1]); epoch=int(sys.argv[2])
          sdists=sorted(dist_dir.glob("*.tar.gz"))
          if len(sdists)!=1: raise SystemExit(f"expected one sdist in {dist_dir}: {sdists}")
          sdist=sdists[0]
          with tarfile.open(sdist,"r:gz") as source:
              members=[]
              for original in source.getmembers():
                  payload=None
                  if original.isfile():
                      extracted=source.extractfile(original)
                      if extracted is None: raise SystemExit(f"cannot read {original.name}")
                      payload=extracted.read()
                  members.append((original,payload))
          def mode(member):
              if member.isdir(): return 0o755
              if member.issym() or member.islnk(): return 0o777
              return 0o755 if member.mode & 0o111 else 0o644
          fd,tmp=tempfile.mkstemp(prefix=f".{sdist.name}.",suffix=".tmp",dir=sdist.parent); os.close(fd); tmp=Path(tmp)
          try:
              with tmp.open("wb") as raw:
                  with gzip.GzipFile(filename="",mode="wb",fileobj=raw,compresslevel=9,mtime=epoch) as compressed:
                      with tarfile.open(fileobj=compressed,mode="w",format=tarfile.PAX_FORMAT) as target:
                          for original,payload in sorted(members,key=lambda item:item[0].name):
                              member=copy.copy(original); member.mtime=epoch; member.uid=0; member.gid=0; member.uname=""; member.gname=""; member.mode=mode(member); member.pax_headers={}
                              target.addfile(member,io.BytesIO(payload) if payload is not None else None)
              tmp.replace(sdist)
          finally:
              if tmp.exists(): tmp.unlink()
          PY
          }
          python -m pip install "build==1.5.0" "twine==6.2.0"
          python scripts/release_artifacts.py verify-history release-history.json
          version="$(python scripts/release_artifacts.py version)"; tag="v$version"; commit_sha="$(git rev-parse HEAD)"
          python scripts/release_artifacts.py verify-tag "$tag"
          rm -rf build dist dist-a dist-b *.egg-info src/*.egg-info
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" PYTHONHASHSEED=0
          python -m build --outdir dist-a; normalize_sdist dist-a
          rm -rf build *.egg-info src/*.egg-info
          python -m build --outdir dist-b; normalize_sdist dist-b
          python scripts/release_artifacts.py compare-builds dist-a dist-b
          mv dist-a dist; rm -rf dist-b
          python -m twine check dist/*
          python scripts/release_artifacts.py verify-wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" --expected-version "$version"
          python scripts/release_artifacts.py verify-sdist "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" --expected-version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
      - name: Build historical release audit and immutable manifests
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          python scripts/release_artifacts.py historical-report release-history.json --repository "$GITHUB_REPOSITORY" --output dist/historical-release-report.json --release-commit "$COMMIT_SHA"
          python scripts/release_artifacts.py manifest dist --checksums dist/SHA256SUMS.txt --json dist/release-manifest.json --commit-sha "$COMMIT_SHA"
      - name: Clean-install and exercise wheel
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python -m venv /tmp/aasm-release-venv
          /tmp/aasm-release-venv/bin/python -m pip install dist/*.whl
          /tmp/aasm-release-venv/bin/python - <<'PY'
          import os, aasm
          assert aasm.__version__ == os.environ["EXPECTED_VERSION"]
          assert aasm.validate_public_api_contract()["valid"]
          PY
          /tmp/aasm-release-venv/bin/aasm adoption-contract >/tmp/adoption.json
          /tmp/aasm-release-venv/bin/aasm runbook history-diagnosis >/tmp/runbook.json
      - name: Publish once and verify every remote asset byte
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing in-place repair" >&2
            exit 1
          fi
          gh release create "$TAG" dist/* --target "$COMMIT_SHA" --title "AASM $TAG" --notes-file docs/CURRENT_RELEASE.md
          verified=false
          for _ in $(seq 1 12); do
            if python scripts/release_artifacts.py verify-github-release "$TAG" dist --repository "$GITHUB_REPOSITORY" --expected-commit "$COMMIT_SHA"; then verified=true; break; fi
            sleep 5
          done
          test "$verified" = true
          gh api "repos/$GITHUB_REPOSITORY/statuses/$COMMIT_SHA" -f state=success -f context='aasm/release' -f description='deliberate reproducible release and exact remote assets verified' -f target_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: aasm-${{ steps.release.outputs.version }}-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  release_failure:
    needs: [release_intent, build_release]
    if: always() && needs.release_intent.result == 'success' && needs.build_release.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish release failure status
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.release_intent.outputs.commit_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$COMMIT_SHA" \
            -f state=failure -f context='aasm/release' \
            -f description='explicit release build/publication gate failed' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
