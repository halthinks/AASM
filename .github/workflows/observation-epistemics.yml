name: AASM S3 Observation Epistemics Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-observation-epistemics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  observation_epistemics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install S3 observation epistemics qualification dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile S3 observation lifecycle and fusion foundation
        run: |
          python -m compileall -q \
            src/aasm/observation_lifecycle.py \
            src/aasm/observation_fusion.py \
            src/aasm/observation_processing_runtime.py \
            tests/test_observation_processing.py \
            scripts/check_observation_processing_contracts.py
      - name: Check S3 observation lifecycle and fusion source contracts
        run: python scripts/check_observation_processing_contracts.py
      - name: Run S3 lifecycle, fusion, authority-firewall, and replay fixtures
        run: pytest -q tests/test_observation_processing.py
      - name: Publish S3 observation epistemics qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='S3 observation lifecycle+fusion epistemic containment passed'
          else
            state=failure
            description='S3 observation epistemics qualification failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context='aasm/observation-epistemics' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
