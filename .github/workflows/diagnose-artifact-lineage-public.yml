name: Diagnose artifact lineage public adoption

on:
  push:
    branches: [artifact-lineage-public-adoption]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Reapply guarded edit in workspace
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^          python - <<'"'"'PY'"'"'$/ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/promote-artifact-lineage-public.yml > /tmp/promote.py
          test -s /tmp/promote.py
          python /tmp/promote.py
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile edited surface
        run: python -m compileall -q src tests scripts
      - name: Check artifact lineage source firewall
        run: python scripts/check_artifact_lineage_contracts.py
      - name: Run artifact lineage corpus
        run: pytest -q tests/test_artifact_lineage_*.py
      - name: Run v0.56 public candidate corpus
        run: pytest -q tests/test_v56_public_candidate.py
      - name: Check patch hygiene
        run: git diff --check
