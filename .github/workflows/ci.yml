name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify tracked file inventory
        run: python scripts/release_manifest.py --check-file-list
      - name: Compile source and tests
        run: python -m compileall -q src tests examples scripts
      - name: Validate embedded Control Center JavaScript
        run: |
          python - <<'PY' > /tmp/aasm-control-center.js
          from aasm.control_center import html_document
          page = html_document()
          start = page.index("<script>") + len("<script>")
          end = page.index("</script>", start)
          print(page[start:end])
          PY
          node --check /tmp/aasm-control-center.js
      - name: Test
        run: pytest -q

  postgres_integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aasm
          POSTGRES_PASSWORD: aasm
          POSTGRES_DB: aasm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aasm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AASM_TEST_POSTGRES_DSN: postgresql://aasm:aasm@127.0.0.1:5432/aasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PostgreSQL extra
        run: python -m pip install -e '.[dev,postgres]'
      - name: PostgreSQL coordination test
        run: pytest -q tests/test_postgres_integration.py

  ci_summary:
    if: always()
    needs: [test, postgres_integration]
    runs-on: ubuntu-latest
    steps:
      - name: Publish direct-push-visible commit status
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          POSTGRES_RESULT: ${{ needs.postgres_integration.result }}
        run: |
          if [ "$TEST_RESULT" = "success" ] && [ "$POSTGRES_RESULT" = "success" ]; then
            state=success
            description="unit matrix, Control Center JS, and PostgreSQL integration passed"
          else
            state=failure
            description="unit=$TEST_RESULT postgres=$POSTGRES_RESULT"
          fi
          export state description
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["state"],
              "context": "aasm/ci-summary",
              "description": os.environ["description"][:140],
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/status.json
          if [ "$state" != "success" ]; then
            exit 1
          fi
