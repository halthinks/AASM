name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify tracked file inventory
        run: python scripts/release_manifest.py --check-file-list
      - name: Compile source and tests
        run: python -m compileall -q src tests examples scripts
      - name: Validate formal model and release source contracts
        run: |
          python scripts/check_formal_models.py
          python scripts/check_release_contracts.py
      - name: Validate every embedded Control Center script
        run: |
          python - <<'PY' > /tmp/aasm-control-center.js
          import re
          from aasm.control_center import html_document

          scripts = re.findall(r"<script>(.*?)</script>", html_document(), flags=re.S)
          if not scripts:
              raise SystemExit("Control Center contains no script blocks")
          print("\n;\n".join(scripts))
          PY
          node --check /tmp/aasm-control-center.js
      - name: Test
        run: pytest -q

  wheel_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Verify release contents and metadata
        run: |
          python scripts/release_artifacts.py verify-history release-history.json
          python scripts/release_artifacts.py verify-wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          python scripts/release_artifacts.py verify-sdist "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/aasm-wheel
          /tmp/aasm-wheel/bin/python -m pip install --upgrade pip
          /tmp/aasm-wheel/bin/python -m pip install dist/*.whl
          /tmp/aasm-wheel/bin/python - <<'PY'
          import aasm
          assert aasm.__version__ == "0.28.0"
          assert aasm.validate_public_api_contract()["valid"] is True
          PY
          /tmp/aasm-wheel/bin/aasm adoption-contract > /tmp/aasm-contract.json
          /tmp/aasm-wheel/bin/aasm runbook history-diagnosis > /tmp/aasm-runbook.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/aasm-contract.json'))['valid'] is True
          assert json.load(open('/tmp/aasm-runbook.json'))['valid'] is True
          PY

  postgres_integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aasm
          POSTGRES_PASSWORD: aasm
          POSTGRES_DB: aasm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aasm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AASM_TEST_POSTGRES_DSN: postgresql://aasm:aasm@127.0.0.1:5432/aasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PostgreSQL extra
        run: python -m pip install -e '.[dev,postgres]'
      - name: PostgreSQL coordination test
        run: pytest -q tests/test_postgres_integration.py

  compose_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AASM_DEMO_TOKEN: ci-demo-token
      AASM_PORT: 18787
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Start the complete local stack
        run: docker compose up --build -d
      - name: Verify PostgreSQL runtime worker reference machines and replay
        run: docker compose run --rm stackctl check --timeout 180
      - name: Show final stack state
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --tail=200 || true
      - name: Remove local stack volumes
        if: always()
        run: docker compose down --volumes --remove-orphans || true

  ci_summary:
    if: always()
    needs: [test, wheel_smoke, postgres_integration, compose_smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Publish direct-push-visible commit status
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          WHEEL_RESULT: ${{ needs.wheel_smoke.result }}
          POSTGRES_RESULT: ${{ needs.postgres_integration.result }}
          COMPOSE_RESULT: ${{ needs.compose_smoke.result }}
        run: |
          if [ "$TEST_RESULT" = "success" ] && [ "$WHEEL_RESULT" = "success" ] && [ "$POSTGRES_RESULT" = "success" ] && [ "$COMPOSE_RESULT" = "success" ]; then
            state=success
            description="unit matrix, clean wheel, PostgreSQL, and Compose full-stack smoke passed"
          else
            state=failure
            description="unit=$TEST_RESULT wheel=$WHEEL_RESULT postgres=$POSTGRES_RESULT compose=$COMPOSE_RESULT"
          fi
          export state description
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["state"],
              "context": "aasm/ci-summary",
              "description": os.environ["description"][:140],
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/status.json
          if [ "$state" != "success" ]; then
            exit 1
          fi
