name: One-shot guarded S3 documentation sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-run-s3-doc-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Correct one stale current-release phrase anchor in the one-shot script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/one_shot_sync_s3_docs.py')
          text = p.read_text(encoding='utf-8')
          old = '    old_phrase = f"qualified the active `0.56.1 / {ADOPTION}` candidate with all required direct contexts green, including:"'
          new = '    old_phrase = "qualified the active `0.56.1 / 0.32.7` candidate with all required direct contexts green, including:"'
          if text.count(old) != 1:
              raise SystemExit('current-release phrase anchor patch drift')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run guarded documentation transforms
        run: python scripts/one_shot_sync_s3_docs.py
      - name: Commit synchronized documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ROADMAP.md docs/roadmaps/GOVERNED_SEMANTIC_EVOLUTION_ROADMAP.md docs/implementation/GOVERNED_SEMANTIC_EVOLUTION_EXECUTION_LEDGER.md docs/CURRENT_RELEASE.md docs/RELEASE_0.56.1.md
          git diff --cached --quiet && exit 0
          git commit -m 'Synchronize docs with qualified S3 lineage boundary'
          git push origin HEAD:main
