name: Optimization Backends

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  v52_contracts:
    name: v0.52 contract and adversarial gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AASM test dependencies
        run: python -m pip install -e '.[dev,optimization]'
      - name: Validate v0.52 source and schema contracts
        run: python scripts/check_v52_contracts.py
      - name: Execute v0.52 resource and multi-objective adversarial suite
        run: >-
          pytest -q
          tests/test_resource_routing.py
          tests/test_resource_governance.py
          tests/test_sii_v52.py
          tests/test_runtime_v52_resources.py
          tests/test_v52_multi_objective.py
          tests/test_schemas.py

  native_optimization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AASM native optimization and modeling extras
        run: python -m pip install -e '.[dev,optimization]'
      - name: Execute real CaDiCaL CP-SAT and HiGHS lifecycle tests
        env:
          AASM_REQUIRE_OPTIMIZATION_BACKENDS: "1"
        run: pytest -q tests/test_v44_optimization_real.py
      - name: Execute real CVXPY and PuLP integration tests
        env:
          AASM_REQUIRE_MODELING_BACKENDS: "1"
        run: pytest -q tests/test_v45_modeling_adapters_real.py
      - name: Execute v0.46 real advanced solver lifecycle tests
        env:
          AASM_REQUIRE_ADVANCED_BACKENDS: "1"
        run: pytest -q tests/test_v46_advanced_optimization_real.py
      - name: Execute v0.47 real governed SII native solver lifecycle test
        env:
          AASM_REQUIRE_SII_BACKENDS: "1"
        run: pytest -q tests/test_v47_sii_real.py
      - name: Execute real optimization conformance CLI
        run: |
          aasm optimization-conformance --real > /tmp/aasm-optimization.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/aasm-optimization.json'))
          assert report['status']=='PASS', report
          for check in ('sat_native_backend_executes','cp_sat_native_backend_executes','milp_native_backend_executes'):
              assert report['checks'][check] is True, report
          PY
      - name: Execute real modeling conformance CLI
        env:
          AASM_REQUIRE_MODELING_BACKENDS: "1"
        run: |
          aasm modeling-conformance --real > /tmp/aasm-modeling.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/aasm-modeling.json'))
          assert report['status']=='PASS', report
          assert report['real_backends'] is True
          for check in ('cvxpy_qp_executes','cvxpy_soc_executes','pulp_imports_to_native_milp'):
              assert report['checks'][check] is True, report
          PY
      - name: Execute v0.46 real advanced optimization conformance module
        env:
          AASM_REQUIRE_ADVANCED_BACKENDS: "1"
        run: |
          python - <<'PY'
          from aasm.advanced_optimization_conformance import run_advanced_optimization_conformance
          report=run_advanced_optimization_conformance(real=True)
          assert report['status']=='PASS', report
          for check in (
              'fast_sat_real_backend_executes',
              'incremental_sat_real_backend_executes',
              'incremental_sat_unsat_core_returned',
              'incremental_sat_session_reused',
              'cp_sat_scheduling_real_backend_executes',
              'milp_advanced_real_backend_executes',
              'milp_bound_telemetry_present',
              'milp_warm_start_recorded',
              'convex_advanced_real_backend_executes',
          ):
              assert report['checks'][check] is True, report
          PY
      - name: Execute governed v0.47 SII graduation certification
        run: |
          aasm certify --target sii-preview > /tmp/aasm-sii-certification.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/aasm-sii-certification.json'))
          assert report['status']=='PASS', report
          target=report['targets'][0]
          assert target['status']=='PASS', target
          checks={row['check_id']: row['status'] for row in target['checks']}
          for check in (
              'measurement-principal-authority-binding',
              'resource-lease-native-solver-enforcement',
              'resource-lease-scheduler-enforcement',
              'mandatory-verification-not-reduced',
          ):
              assert checks[check]=='PASS', report
          PY
