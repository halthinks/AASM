name: Apply Durable Resource Reestimate Transitions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply durable resource reestimate transitions'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply runtime and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/aasm/_runtime_v52_resources.py')
          text = path.read_text()

          old = '''    ResourceRoutingPolicy,\n    reserve_candidate_resources,\n    select_resource_aware_candidate,\n)\n'''
          new = '''    ResourceRoutingPolicy,\n    planning_allocatable,\n    reserve_candidate_resources,\n    select_resource_aware_candidate,\n)\n'''
          if old not in text: raise SystemExit('import anchor missing')
          text = text.replace(old, new, 1)

          old = '''    settlements: dict[str, dict[str, Any]] = {}\n    routing_transactions: dict[str, dict[str, Any]] = {}\n'''
          new = '''    settlements: dict[str, dict[str, Any]] = {}\n    reestimates: dict[str, dict[str, Any]] = {}\n    releases: dict[str, dict[str, Any]] = {}\n    routing_transactions: dict[str, dict[str, Any]] = {}\n'''
          if old not in text: raise SystemExit('projection declarations anchor missing')
          text = text.replace(old, new, 1)

          old = '''            for resource_id, capacity_document in (document.get("post_capacities") or {}).items():\n                capacities[str(resource_id)] = deepcopy(capacity_document)\n\n    return {\n        "capacities": capacities,\n        "observations": observations,\n        "decisions": decisions,\n        "reservations": reservations,\n        "settlements": settlements,\n        "routing_transactions": routing_transactions,\n    }\n'''
          new = '''            for resource_id, capacity_document in (document.get("post_capacities") or {}).items():\n                capacities[str(resource_id)] = deepcopy(capacity_document)\n        elif record_type == "reservation_reestimate":\n            reestimate_id = str(document["reestimate_id"])\n            reestimates[reestimate_id] = document\n            reservation_id = str(document["reservation_id"])\n            if reservation_id in reservations:\n                if document.get("outcome") == "CONTINUE":\n                    revised = deepcopy(document.get("revised_allocations") or [])\n                    reservations[reservation_id] = {\n                        **reservations[reservation_id],\n                        "allocations": revised,\n                        "total_reserved": sum(float(amount) for _, amount in revised),\n                        "status": "ACTIVE",\n                        "reestimate_id": reestimate_id,\n                    }\n                else:\n                    reservations[reservation_id] = {\n                        **reservations[reservation_id],\n                        "status": "REPLAN_REQUIRED",\n                        "reestimate_id": reestimate_id,\n                    }\n            for resource_id, capacity_document in (document.get("post_capacities") or {}).items():\n                capacities[str(resource_id)] = deepcopy(capacity_document)\n        elif record_type == "reservation_release":\n            release_id = str(document["release_id"])\n            releases[release_id] = document\n            reservation_id = str(document["reservation_id"])\n            if reservation_id in reservations:\n                reservations[reservation_id] = {\n                    **reservations[reservation_id],\n                    "status": "RELEASED",\n                    "release_id": release_id,\n                }\n            for resource_id, capacity_document in (document.get("post_capacities") or {}).items():\n                capacities[str(resource_id)] = deepcopy(capacity_document)\n\n    return {\n        "capacities": capacities,\n        "observations": observations,\n        "decisions": decisions,\n        "reservations": reservations,\n        "settlements": settlements,\n        "reestimates": reestimates,\n        "releases": releases,\n        "routing_transactions": routing_transactions,\n    }\n'''
          if old not in text: raise SystemExit('projection transaction anchor missing')
          text = text.replace(old, new, 1)

          old = '''            "settlement": "ONE_DURABLE_TRANSACTION_RECORD",\n            "scope_access": "WORKSPACE_MATCH_AND_EXISTING_AASM_SCOPE_FLOW",\n'''
          new = '''            "settlement": "ONE_DURABLE_TRANSACTION_RECORD",\n            "reestimate": "CONTINUE_OR_REPLAN_REQUIRED",\n            "release": "ACTIVE_OR_REPLAN_REQUIRED_TO_RELEASED",\n            "scope_access": "WORKSPACE_MATCH_AND_EXISTING_AASM_SCOPE_FLOW",\n'''
          if old not in text: raise SystemExit('contract anchor missing')
          text = text.replace(old, new, 1)

          old = '''        settlements = {\n            key: value for key, value in projection["settlements"].items()\n            if value.get("reservation_id") in reservations\n        }\n        return {\n            "contract": self.resource_runtime_contract_report(),\n            "access_context": {"workspace_id": workspace_id, "scope_id": scope_id},\n            "capacities": visible_capacities,\n            "observations": observations,\n            "decisions": decisions,\n            "reservations": reservations,\n            "settlements": settlements,\n            "routing_transactions": routing_transactions,\n        }\n'''
          new = '''        settlements = {\n            key: value for key, value in projection["settlements"].items()\n            if value.get("reservation_id") in reservations\n        }\n        reestimates = {\n            key: value for key, value in projection["reestimates"].items()\n            if value.get("reservation_id") in reservations\n        }\n        releases = {\n            key: value for key, value in projection["releases"].items()\n            if value.get("reservation_id") in reservations\n        }\n        return {\n            "contract": self.resource_runtime_contract_report(),\n            "access_context": {"workspace_id": workspace_id, "scope_id": scope_id},\n            "capacities": visible_capacities,\n            "observations": observations,\n            "decisions": decisions,\n            "reservations": reservations,\n            "settlements": settlements,\n            "reestimates": reestimates,\n            "releases": releases,\n            "routing_transactions": routing_transactions,\n        }\n'''
          if old not in text: raise SystemExit('report anchor missing')
          text = text.replace(old, new, 1)

          marker = '''\n\n__all__ = [\n    "RESOURCE_RUNTIME_CONTRACT_ID",\n'''
          methods = '''\n\n    def reestimate_resource_reservation(\n        self,\n        reservation_id: str,\n        revised_allocations: Mapping[str, float],\n        policy: ResourceRoutingPolicy,\n        *,\n        workspace_id: str | None = None,\n        scope_id: str | None = None,\n        evidence_ids=(),\n    ) -> dict[str, Any]:\n        projection = _project(self.snapshot)\n        try:\n            reservation = projection["reservations"][reservation_id]\n        except KeyError:\n            raise KeyError(reservation_id) from None\n        self._validate_resource_context(workspace_id=workspace_id, scope_id=scope_id)\n        if not _context_matches(reservation, workspace_id=workspace_id, scope_id=scope_id):\n            raise PermissionError("resource reestimate crosses workspace/scope boundary")\n        if reservation.get("status") != "ACTIVE":\n            raise ValueError("resource reservation is not active")\n\n        current = {str(resource_id): float(amount) for resource_id, amount in reservation.get("allocations", [])}\n        revised = {str(key): float(value) for key, value in revised_allocations.items()}\n        if set(revised) != set(current):\n            raise ValueError("reestimate resource keys must exactly match reserved resources")\n        if any(value < 0 for value in revised.values()):\n            raise ValueError("reestimated resource demand must be non-negative")\n\n        capacities = {key: _capacity_from_dict(value) for key, value in projection["capacities"].items()}\n        trial = {key: _capacity_from_dict(value) for key, value in projection["capacities"].items()}\n        for resource_id, amount in current.items():\n            trial[resource_id].release(amount)\n\n        infeasible: list[str] = []\n        for resource_id, amount in sorted(revised.items()):\n            available = planning_allocatable(trial[resource_id], policy)\n            if available is None or amount > available:\n                infeasible.append(resource_id)\n\n        post_capacities: dict[str, dict[str, Any]] = {}\n        if infeasible:\n            outcome = "REPLAN_REQUIRED"\n            revised_rows = [[resource_id, amount] for resource_id, amount in sorted(current.items())]\n        else:\n            outcome = "CONTINUE"\n            for resource_id, amount in sorted(revised.items()):\n                trial[resource_id].reserve(amount)\n                post_capacities[resource_id] = _capacity_to_dict(trial[resource_id])\n            revised_rows = [[resource_id, amount] for resource_id, amount in sorted(revised.items())]\n\n        seed = {\n            "reservation_id": reservation_id,\n            "workspace_id": workspace_id,\n            "scope_id": scope_id,\n            "previous_allocations": [[key, value] for key, value in sorted(current.items())],\n            "revised_allocations": revised_rows,\n            "requested_allocations": [[key, value] for key, value in sorted(revised.items())],\n            "outcome": outcome,\n            "infeasible_resources": infeasible,\n            "post_capacities": post_capacities,\n        }\n        reestimate_id = f"resource-reestimate-{semantic_fingerprint(seed)[:20]}"\n        document = {"reestimate_id": reestimate_id, **seed}\n        evidence_id = self._record_resource_document(\n            record_type="reservation_reestimate",\n            object_id=reestimate_id,\n            document=document,\n            source=RESOURCE_RUNTIME_CONTRACT_ID,\n            derived_from=evidence_ids,\n        )\n        return {"reestimate": document, "evidence_id": evidence_id}\n\n    def release_resource_reservation(\n        self,\n        reservation_id: str,\n        *,\n        workspace_id: str | None = None,\n        scope_id: str | None = None,\n        evidence_ids=(),\n    ) -> dict[str, Any]:\n        projection = _project(self.snapshot)\n        try:\n            reservation = projection["reservations"][reservation_id]\n        except KeyError:\n            raise KeyError(reservation_id) from None\n        self._validate_resource_context(workspace_id=workspace_id, scope_id=scope_id)\n        if not _context_matches(reservation, workspace_id=workspace_id, scope_id=scope_id):\n            raise PermissionError("resource release crosses workspace/scope boundary")\n        if reservation.get("status") not in {"ACTIVE", "REPLAN_REQUIRED"}:\n            raise ValueError("resource reservation cannot be released from current status")\n\n        allocations = {str(resource_id): float(amount) for resource_id, amount in reservation.get("allocations", [])}\n        capacities = {key: _capacity_from_dict(value) for key, value in projection["capacities"].items()}\n        post_capacities: dict[str, dict[str, Any]] = {}\n        for resource_id, amount in sorted(allocations.items()):\n            capacities[resource_id].release(amount)\n            post_capacities[resource_id] = _capacity_to_dict(capacities[resource_id])\n\n        seed = {\n            "reservation_id": reservation_id,\n            "workspace_id": workspace_id,\n            "scope_id": scope_id,\n            "released_allocations": [[key, value] for key, value in sorted(allocations.items())],\n            "post_capacities": post_capacities,\n        }\n        release_id = f"resource-release-{semantic_fingerprint(seed)[:20]}"\n        document = {"release_id": release_id, **seed}\n        evidence_id = self._record_resource_document(\n            record_type="reservation_release",\n            object_id=release_id,\n            document=document,\n            source=RESOURCE_RUNTIME_CONTRACT_ID,\n            derived_from=evidence_ids,\n        )\n        return {"release": document, "evidence_id": evidence_id}\n'''
          if marker not in text: raise SystemExit('__all__ marker missing')
          text = text.replace(marker, methods + marker, 1)
          path.write_text(text)

          tests = Path('tests/test_runtime_v52_resources.py')
          t = tests.read_text()
          addition = r'''\n\ndef test_reestimate_feasible_growth_updates_reservation_and_committed_capacity():\n    engine = AASMEngine(ProblemSpec("resource reestimate grow"))\n    engine.register_resource_capacity(capacity(consumed=60, reserve=20))\n    engine.record_resource_observation(ResourceObservation(\n        resource_id="expert-weekly",\n        observed_at=datetime(2026, 8, 15, tzinfo=timezone.utc),\n        source="provider_usage_surface",\n        measurement_authority=MeasurementAuthority.OBSERVED,\n        reported_remaining=35.0,\n    ), workspace_id=WORKSPACE, scope_id=SCOPE)\n    result = route(engine, [candidate(amount=4)])\n    reservation_id = result["transaction"]["reservation"]["reservation_id"]\n    changed = engine.reestimate_resource_reservation(\n        reservation_id, {"expert-weekly": 10.0}, ResourceRoutingPolicy(),\n        workspace_id=WORKSPACE, scope_id=SCOPE,\n    )\n    assert changed["reestimate"]["outcome"] == "CONTINUE"\n    value = report(engine)\n    assert value["reservations"][reservation_id]["allocations"] == [["expert-weekly", 10.0]]\n    assert value["capacities"]["expert-weekly"]["committed"] == 10.0\n    assert engine.replay().canonical_hash() == engine.snapshot.canonical_hash()\n\n\ndef test_reestimate_beyond_observed_weekly_cap_requires_replan_without_overspend():\n    engine = AASMEngine(ProblemSpec("resource replan"))\n    engine.register_resource_capacity(capacity(consumed=60, reserve=20))\n    engine.record_resource_observation(ResourceObservation(\n        resource_id="expert-weekly",\n        observed_at=datetime(2026, 8, 15, tzinfo=timezone.utc),\n        source="provider_usage_surface",\n        measurement_authority=MeasurementAuthority.OBSERVED,\n        reported_remaining=25.0,\n    ), workspace_id=WORKSPACE, scope_id=SCOPE)\n    result = route(engine, [candidate(amount=4)])\n    reservation_id = result["transaction"]["reservation"]["reservation_id"]\n    changed = engine.reestimate_resource_reservation(\n        reservation_id, {"expert-weekly": 6.0}, ResourceRoutingPolicy(),\n        workspace_id=WORKSPACE, scope_id=SCOPE,\n    )\n    assert changed["reestimate"]["outcome"] == "REPLAN_REQUIRED"\n    value = report(engine)\n    assert value["reservations"][reservation_id]["status"] == "REPLAN_REQUIRED"\n    assert value["capacities"]["expert-weekly"]["committed"] == 4.0\n    with pytest.raises(ValueError, match="not active"):\n        engine.settle_resource_reservation(reservation_id, {"expert-weekly": 4.0}, workspace_id=WORKSPACE, scope_id=SCOPE)\n    assert engine.replay().canonical_hash() == engine.snapshot.canonical_hash()\n\n\ndef test_replan_required_reservation_can_be_released_for_rerouting():\n    engine = AASMEngine(ProblemSpec("resource release for reroute"))\n    engine.register_resource_capacity(capacity(consumed=60, reserve=20))\n    engine.record_resource_observation(ResourceObservation(\n        resource_id="expert-weekly",\n        observed_at=datetime(2026, 8, 15, tzinfo=timezone.utc),\n        source="provider_usage_surface",\n        measurement_authority=MeasurementAuthority.OBSERVED,\n        reported_remaining=25.0,\n    ), workspace_id=WORKSPACE, scope_id=SCOPE)\n    result = route(engine, [candidate(amount=4)])\n    reservation_id = result["transaction"]["reservation"]["reservation_id"]\n    engine.reestimate_resource_reservation(\n        reservation_id, {"expert-weekly": 6.0}, ResourceRoutingPolicy(),\n        workspace_id=WORKSPACE, scope_id=SCOPE,\n    )\n    released = engine.release_resource_reservation(reservation_id, workspace_id=WORKSPACE, scope_id=SCOPE)\n    assert released["release"]["released_allocations"] == [["expert-weekly", 4.0]]\n    value = report(engine)\n    assert value["reservations"][reservation_id]["status"] == "RELEASED"\n    assert value["capacities"]["expert-weekly"]["committed"] == 0.0\n    assert engine.replay().canonical_hash() == engine.snapshot.canonical_hash()\n'''
          if 'test_reestimate_feasible_growth_updates_reservation_and_committed_capacity' not in t:
              tests.write_text(t + addition)
          PY
          rm .github/workflows/_apply-resource-reestimate.yml
          python -m compileall -q src/aasm tests
          python scripts/release_manifest.py --check-file-list
      - name: Commit transitions to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add durable resource reestimate and release transitions'
          git push origin HEAD:main
