name: AASM v0.56 Development Qualification
# Qualified additive S4 lineage: Quantity 0.32.16 -> Rule 0.32.17 -> Projection/Equivalence 0.32.18 -> U/S/T 0.32.19 -> active Degraded Operation 0.32.20; Risk/Irreversibility, Obligation Phases, and Safety Envelope/Hybrid State remain pre-admission.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-v56-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  v56:
    runs-on: ubuntu-24.04
    env:
      AASM_REQUIRE_V561_PROVIDERS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install cumulative v0.56 development qualification dependencies
        run: python -m pip install -e '.[dev,optimization]'

      - name: Check truthful solver outcome contracts
        run: python scripts/check_v56_solver_outcome.py
      - name: Run complete solver outcome fixtures
        run: pytest -q tests/test_v56_solver_outcome_v2.py tests/test_v56_provider_status_v2.py tests/test_v56_solver_outcome_runtime.py tests/test_v56_public_candidate.py
      - name: Qualify real provider status identity
        run: |
          python - <<'PY'
          from aasm.optimization import OptimizationRequest, reference_optimization_models, solve_optimization_request, validate_optimization_result
          from aasm.provider_status_v2 import default_provider_status_map, map_provider_status
          providers={'SAT':'cadical','CP_SAT':'ortools-cp-sat','MILP':'highs'}; caps={'SAT':'solver.sat','CP_SAT':'solver.cp_sat','MILP':'solver.milp'}
          for family, model in reference_optimization_models().items():
              req=OptimizationRequest(model,caps[family],'0.1.0',f'v56-real-{family.lower()}',required_provider=providers[family])
              result=solve_optimization_request(req); validate_optimization_result(req,result)
              raw=str(result.statistics.get('raw_status') or ''); code=str(result.statistics.get('raw_status_code') or '')
              assert raw and code
              mapped=map_provider_status(default_provider_status_map(result.solver.provider_id,result.solver.version),raw_status=raw,raw_status_code=code,has_incumbent=bool(result.assignment),objective_present=model.objective is not None)
              assert mapped.mapping_status=='EXACT_RULE'
          PY

      - name: Check execution provenance contracts
        run: python scripts/check_v561_provenance.py
      - name: Run provenance replay and adversarial fixtures
        run: pytest -q tests/test_v56_solver_provenance.py tests/test_v56_solver_provenance_runtime.py
      - name: Qualify real provider provenance
        run: pytest -q tests/test_v561_solver_provenance_real.py

      - name: Check state authority contracts and adversarial fixtures
        run: |
          python scripts/check_state_authority_contracts.py
          pytest -q tests/test_state_authority.py
      - name: Check external machine binding contracts and adversarial fixtures
        run: |
          python scripts/check_external_machine_contracts.py
          pytest -q tests/test_external_machine.py
      - name: Check machine transition proposal contracts and adversarial fixtures
        run: |
          python scripts/check_machine_transition_contracts.py
          pytest -q tests/test_machine_transition.py
      - name: Check machine postcondition verification contracts and adversarial fixtures
        run: |
          python scripts/check_machine_postcondition_contracts.py
          pytest -q tests/test_machine_postcondition.py
      - name: Check physical authority contracts and adversarial fixtures
        run: |
          python scripts/check_physical_authority_contracts.py
          pytest -q tests/test_physical_authority.py
      - name: Check bounded effect capability contracts and adversarial fixtures
        run: |
          python scripts/check_effect_capability_contracts.py
          pytest -q tests/test_effect_capability.py
      - name: Check stale command fencing and semantic preemption
        run: |
          python scripts/check_physical_control_fencing_contracts.py
          pytest -q tests/test_physical_control_fencing.py
      - name: Check semantic preemption crash recovery
        run: pytest -q tests/test_physical_preemption_recovery.py
      - name: Check PR-3H physical effect integration
        run: |
          python scripts/check_physical_effect_integration_contracts.py
          pytest -q tests/test_physical_effect_integration.py

      - name: Check S3 state conflict physical evidence foundation
        run: |
          python scripts/check_state_conflict_contracts.py
          pytest -q tests/test_state_conflict.py
      - name: Check S3 causal identity and freshness physical evidence foundation
        run: |
          python scripts/check_causal_freshness_contracts.py
          pytest -q tests/test_causal_freshness.py
      - name: Check S3 identity calibration trust physical evidence foundation
        run: |
          python scripts/check_identity_calibration_trust_contracts.py
          pytest -q tests/test_identity_calibration_trust.py
      - name: Check S3 execution environment physical evidence foundation
        run: |
          python scripts/check_execution_environment_contracts.py
          pytest -q tests/test_execution_environment.py
      - name: Check S3 observation lifecycle and fusion epistemic containment
        run: |
          python scripts/check_observation_processing_contracts.py
          pytest -q tests/test_observation_processing.py
      - name: Check S3 artifact revision lineage and replay
        run: |
          python scripts/check_artifact_lineage_contracts.py
          pytest -q tests/test_artifact_lineage_foundation.py tests/test_artifact_lineage_runtime.py tests/test_artifact_lineage_envelope.py
      - name: Check S3 entity evolution and public adoption
        run: |
          python scripts/check_entity_evolution_contracts.py
          pytest -q tests/test_entity_evolution.py tests/test_entity_evolution_public.py

      - name: Check S4 engineering Quantity semantic foundation and public adoption
        run: |
          python scripts/check_quantity_contracts.py
          python scripts/check_quantity_public.py
          pytest -q tests/test_quantity_foundation.py tests/test_quantity_public.py
      - name: Check S4 engineering Rule semantic foundation and public adoption
        run: |
          python scripts/check_rule_contracts.py
          python scripts/check_rule_public.py
          pytest -q tests/test_rule_foundation.py tests/test_rule_public.py
      - name: Check S4 semantic Projection Equivalence and Invariant foundation/public adoption
        run: |
          python scripts/check_semantic_projection_contracts.py
          python scripts/check_semantic_projection_public.py
          pytest -q tests/test_semantic_projection_foundation.py tests/test_semantic_projection_textpcb.py tests/test_semantic_projection_adversarial.py tests/test_semantic_projection_public.py
      - name: Check S4.4 Uncertainty Scenario and Trace-Property foundation/public adoption
        run: |
          python scripts/check_uncertainty_scenario_trace_contracts.py
          python scripts/check_uncertainty_scenario_trace_public.py
          pytest -q tests/test_uncertainty_scenario_trace_foundation.py tests/test_uncertainty_scenario_trace_public.py
      - name: Check S4.5 Degraded Operation foundation and active public adoption
        run: |
          python scripts/check_degraded_operation_contracts.py
          python scripts/check_degraded_operation_public.py
          pytest -q tests/test_degraded_operation_foundation.py tests/test_degraded_operation_public.py
      - name: Check S4.6 Risk and Irreversibility pre-admission foundation
        run: |
          python scripts/check_risk_irreversibility_contracts.py
          pytest -q tests/test_risk_irreversibility_foundation.py
      - name: Check S4.7 Obligation Phase pre-admission foundation
        run: |
          python scripts/check_obligation_phase_contracts.py
          pytest -q tests/test_obligation_phase_foundation.py
      - name: Check S4.8 Safety Envelope and Hybrid State pre-admission foundation
        run: |
          python scripts/check_safety_envelope_hybrid_state_contracts.py
          pytest -q tests/test_safety_envelope_hybrid_state_foundation.py

      - name: Check S4.9 Epistemic Debt and Manual Override pre-admission foundation
        run: |
          python scripts/check_epistemic_debt_manual_override_contracts.py
          pytest -q tests/test_epistemic_debt_manual_override_foundation.py

      - name: Validate cumulative development source contract
        run: |
          python scripts/check_release_contracts.py
          python scripts/check_s48_release_contracts.py
          python scripts/check_s49_release_contracts.py

      - name: Guard active 0.56.1 development root and semantic-runtime separation
        run: |
          python - <<'PY'
          import aasm
          from aasm import public_v55, public_v56
          active=aasm.validate_public_api_contract(); assert active['valid'], active
          contract=aasm.public_api_contract()
          assert aasm.__version__=='0.56.1'
          assert contract['contract_version']=='0.32.20'
          assert contract['parent_contract_version']=='0.32.19'
          assert public_v56.__version__=='0.56.1'
          assert public_v56.PUBLIC_API_CONTRACT['contract_version']=='0.32.6'
          assert public_v55.__version__=='0.55.0'
          assert aasm.AASMEngine is public_v56.AASMEngine
          for key in ('engineering_quantity','engineering_rule','semantic_projection','uncertainty','scenario','trace_property','degraded_operation'):
              assert key in contract, key
              assert contract[key]['runtime_admission']=='PRE_ADMISSION_ONLY', (key, contract[key])
          assert contract['uncertainty']['contract_id']=='aasm.uncertainty.v1'
          assert contract['scenario']['contract_id']=='aasm.scenario.v1'
          assert contract['trace_property']['contract_id']=='aasm.trace-property.v1'
          assert contract['degraded_operation']['contract_id']=='aasm.degraded.operation.v1'
          assert contract['scenario']['scenario_activation']=='NONE_FOUNDATION_ONLY'
          assert contract['trace_property']['trace_projection']=='EXISTING_PROJECT_TRACE_FUNCTION_UNCHANGED'
          assert contract['trace_property']['static_constraint_lowering']=='NONE'
          assert contract['degraded_operation']['mode_activation']=='NONE'
          assert contract['degraded_operation']['active_root_status']=='ACTIVE_QUALIFIED_PUBLIC_ROOT'
          assert contract['degraded_operation']['assessment_is_authorization'] is False
          assert contract['degraded_operation']['assessment_activates_mode'] is False
          assert contract['degraded_operation']['assessment_proves_safety'] is False
          assert all(v=='NONE' for v in contract['uncertainty']['public_claim_ceiling'].values())
          assert all(v=='NONE' for v in contract['scenario']['public_claim_ceiling'].values())
          assert all(v=='NONE' for v in contract['trace_property']['public_claim_ceiling'].values())
          assert all(v=='NONE' for v in contract['degraded_operation']['public_claim_ceiling'].values())
          for key in ('obligation_phase','safety_envelope','hybrid_state','safety_envelope_assessment','epistemic_debt','manual_override','manual_override_assessment'):
              assert key not in contract
          for name in ('ObligationPhasePlan','SafetyEnvelope','HybridState','SafetyEnvelopeAssessment','EpistemicDebtProjection','ManualOverride','ManualOverrideAssessment'):
              assert not hasattr(aasm, name)
          methods=aasm.SUPPORTED_ENGINE_METHODS
          assert not any(name.startswith(('rule_','semantic_projection_','semantic_equivalence_','uncertainty_','scenario_','trace_property_','degraded_operation_','risk_','irreversibility_','obligation_phase_','safety_envelope_','hybrid_state_','epistemic_debt_','manual_override_')) for name in methods)
          print('cumulative 0.56.1 + active adoption 0.32.20 PR-3 + S3 + S4 through Epistemic Debt/Manual Override pre-admission: PASS')
          PY

      - name: Publish cumulative v0.56 development qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='0.56.1 cumulative PR-3+S3+S4 through active 0.32.20 and S4.9 pre-admission passed'
          else
            state=failure
            description='0.56 cumulative development qualification failed'
          fi
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='aasm/v56' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          echo 'failed to publish aasm/v56 after bounded retries' >&2
          exit 1
