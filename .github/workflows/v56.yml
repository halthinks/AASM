name: AASM v0.56 Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-v56-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  v56:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Apply one-time current-root compatibility maintenance
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          targets = [
              "tests/test_v39_typed_capabilities.py",
              "tests/test_v40_hierarchical_memory.py",
              "tests/test_v42_reference_domains.py",
              "tests/test_v44_optimization.py",
              "tests/test_v45_public.py",
              "tests/test_v46_public.py",
              "tests/test_v47_public.py",
              "tests/test_v48_public.py",
          ]
          for name in targets:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = text.replace('assert __version__ == "0.55.0"', 'assert __version__ == "0.56.0"')
              text = text.replace("assert __version__=='0.55.0'", "assert __version__=='0.56.0'")
              text = text.replace('assert report["contract"]["contract_version"] == "0.31.0"', 'assert report["contract"]["contract_version"] == "0.32.0"')
              text = text.replace("assert report['contract']['contract_version']=='0.31.0'", "assert report['contract']['contract_version']=='0.32.0'")
              path.write_text(text, encoding="utf-8")
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("**Next cumulative release:**", "**Next release / cumulative release:**")
          readme.write_text(text, encoding="utf-8")
          PY
          if ! git diff --quiet -- README.md tests/test_v39_typed_capabilities.py tests/test_v40_hierarchical_memory.py tests/test_v42_reference_domains.py tests/test_v44_optimization.py tests/test_v45_public.py tests/test_v46_public.py tests/test_v47_public.py tests/test_v48_public.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md tests/test_v39_typed_capabilities.py tests/test_v40_hierarchical_memory.py tests/test_v42_reference_domains.py tests/test_v44_optimization.py tests/test_v45_public.py tests/test_v46_public.py tests/test_v47_public.py tests/test_v48_public.py
            git commit -m 'Advance historical current-root compatibility assertions to v0.56'
            git push origin HEAD:main
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install v0.56 release qualification dependencies
        run: python -m pip install -e '.[dev,optimization]'
      - name: Verify tracked file inventory
        run: python scripts/release_manifest.py --check-file-list
      - name: Check authoritative solver outcome contracts
        run: python scripts/check_v56_solver_outcome.py
      - name: Run complete v0.56 solver outcome fixtures
        run: |
          pytest -q \
            tests/test_v56_solver_outcome_v2.py \
            tests/test_v56_provider_status_v2.py \
            tests/test_v56_solver_outcome_runtime.py \
            tests/test_v56_public_candidate.py
      - name: Qualify real provider raw status identity and v2 mapping
        run: |
          python - <<'PY'
          from aasm.optimization import OptimizationRequest, reference_optimization_models, solve_optimization_request, validate_optimization_result
          from aasm.provider_status_v2 import default_provider_status_map, map_provider_status
          providers = {'SAT': 'cadical', 'CP_SAT': 'ortools-cp-sat', 'MILP': 'highs'}
          capabilities = {'SAT': 'solver.sat', 'CP_SAT': 'solver.cp_sat', 'MILP': 'solver.milp'}
          for family, model in reference_optimization_models().items():
              request = OptimizationRequest(model, capabilities[family], '0.1.0', f'v56-real-{family.lower()}', required_provider=providers[family])
              result = solve_optimization_request(request)
              validate_optimization_result(request, result)
              raw_status = str(result.statistics.get('raw_status') or '')
              raw_code = str(result.statistics.get('raw_status_code') or '')
              assert raw_status, (family, result.to_dict())
              assert raw_code, (family, result.to_dict())
              mapping = map_provider_status(default_provider_status_map(result.solver.provider_id, result.solver.version), raw_status=raw_status, raw_status_code=raw_code, has_incumbent=bool(result.assignment), objective_present=model.objective is not None)
              assert mapping.mapping_status == 'EXACT_RULE', (family, mapping.to_dict())
              if family == 'SAT': assert mapping.normalized_status == 'SAT'
              else: assert mapping.normalized_status == 'OPTIMAL'
          print('real CaDiCaL/PySAT, OR-Tools CP-SAT, and HiGHS status identity qualification: PASS')
          PY
      - name: Validate active v0.56 release source contract
        run: python scripts/check_release_contracts.py
      - name: Guard active v0.56 root and released v0.55 parent
        run: |
          python - <<'PY'
          import aasm
          from aasm import public_v55, public_v56
          report = public_v56.validate_public_api_contract()
          assert report['valid'], report
          assert public_v56.__version__ == '0.56.0'
          assert public_v56.PUBLIC_RELEASE_STABILITY == 'ACTIVE_DEVELOPMENT'
          assert public_v55.__version__ == '0.55.0'
          assert aasm.__version__ == '0.56.0'
          assert aasm.AASMEngine is public_v56.AASMEngine
          assert public_v56.AASMEngine is not public_v55.AASMEngine
          print('active public v0.56 release contract: PASS')
          PY
      - name: Publish v0.56 release qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; description='v0.56 active release qualification passed'; else state=failure; description='v0.56 active release qualification failed'; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='aasm/v56' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
