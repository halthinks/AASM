name: Apply validated hints to OR-Tools safely once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply exact guarded edit
        run: |
          python -c 'import base64; exec(base64.b64decode(""))'
          python -m compileall -q src/aasm/optimization.py
          git rm .github/workflows/apply-v53-ortools-hint-safe-once.yml
          python scripts/release_manifest.py --write-file-list
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/aasm/optimization.py FILE_LIST.txt
          git commit -m 'Consume validated solver learning hints in OR-Tools adapter'
          git push origin HEAD:main
