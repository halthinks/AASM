name: v0.54 Parent Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  v54:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install AASM test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen v0.54 parent contracts under active development root
        run: |
          python scripts/check_v54_contracts.py
          python - <<'PY'
          import aasm
          from aasm import public_v54, public_v55, public_v56
          report = public_v54.validate_public_api_contract()
          assert report['valid'], report
          assert public_v54.__version__ == '0.54.0'
          assert public_v54.PUBLIC_RELEASE_STABILITY == 'ACTIVE_DEVELOPMENT'
          assert public_v54.PUBLIC_API_CONTRACT['contract_version'] == '0.30.0'
          assert public_v55.__version__ == '0.55.0'
          assert public_v56.validate_public_api_contract()['valid']
          assert aasm.__version__ == public_v56.__version__
          assert aasm.AASMEngine is public_v56.AASMEngine
          PY
      - name: Execute v0.54 adversarial and compatibility suite
        run: |
          pytest -q \
            tests/test_runtime_v54_effects.py \
            tests/test_runtime_v54_settlement.py \
            tests/test_runtime_v54_portfolio.py \
            tests/test_runtime_v54_exchange.py \
            tests/test_v54_public.py
      - name: Publish v0.54 parent compatibility status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='v0.54 parent effect/portfolio/exchange compatibility passed under active root'
          else
            state=failure
            description='v0.54 parent compatibility gate failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='aasm/v54' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
