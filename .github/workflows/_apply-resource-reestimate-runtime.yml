name: Apply Resource Reestimate Runtime Only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply resource reestimate runtime only'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Patch runtime and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/aasm/_runtime_v52_resources.py')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label} anchor missing')
              text = text.replace(old, new, 1)

          replace_once(
              '    ResourceRoutingPolicy,\n    reserve_candidate_resources,\n    select_resource_aware_candidate,\n)\n',
              '    ResourceRoutingPolicy,\n    planning_allocatable,\n    reserve_candidate_resources,\n    select_resource_aware_candidate,\n)\n',
              'import',
          )
          replace_once(
              '    settlements: dict[str, dict[str, Any]] = {}\n    routing_transactions: dict[str, dict[str, Any]] = {}\n',
              '    settlements: dict[str, dict[str, Any]] = {}\n    reestimates: dict[str, dict[str, Any]] = {}\n    releases: dict[str, dict[str, Any]] = {}\n    routing_transactions: dict[str, dict[str, Any]] = {}\n',
              'projection declarations',
          )
          replace_once(
              '            for resource_id, capacity_document in (document.get("post_capacities") or {}).items():\n                capacities[str(resource_id)] = deepcopy(capacity_document)\n\n    return {\n        "capacities": capacities,\n        "observations": observations,\n        "decisions": decisions,\n        "reservations": reservations,\n        "settlements": settlements,\n        "routing_transactions": routing_transactions,\n    }\n',
              '            for resource_id, capacity_document in (document.get("post_capacities") or {}).items():\n                capacities[str(resource_id)] = deepcopy(capacity_document)\n        elif record_type == "reservation_reestimate":\n            reestimate_id = str(document["reestimate_id"])\n            reestimates[reestimate_id] = document\n            reservation_id = str(document["reservation_id"])\n            if reservation_id in reservations:\n                if document.get("outcome") == "CONTINUE":\n                    revised = deepcopy(document.get("revised_allocations") or [])\n                    reservations[reservation_id] = {**reservations[reservation_id], "allocations": revised, "total_reserved": sum(float(amount) for _, amount in revised), "status": "ACTIVE", "reestimate_id": reestimate_id}\n                else:\n                    reservations[reservation_id] = {**reservations[reservation_id], "status": "REPLAN_REQUIRED", "reestimate_id": reestimate_id}\n            for resource_id, capacity_document in (document.get("post_capacities") or {}).items():\n                capacities[str(resource_id)] = deepcopy(capacity_document)\n        elif record_type == "reservation_release":\n            release_id = str(document["release_id"])\n            releases[release_id] = document\n            reservation_id = str(document["reservation_id"])\n            if reservation_id in reservations:\n                reservations[reservation_id] = {**reservations[reservation_id], "status": "RELEASED", "release_id": release_id}\n            for resource_id, capacity_document in (document.get("post_capacities") or {}).items():\n                capacities[str(resource_id)] = deepcopy(capacity_document)\n\n    return {\n        "capacities": capacities,\n        "observations": observations,\n        "decisions": decisions,\n        "reservations": reservations,\n        "settlements": settlements,\n        "reestimates": reestimates,\n        "releases": releases,\n        "routing_transactions": routing_transactions,\n    }\n',
              'projection transaction',
          )
          replace_once(
              '            "settlement": "ONE_DURABLE_TRANSACTION_RECORD",\n            "scope_access": "WORKSPACE_MATCH_AND_EXISTING_AASM_SCOPE_FLOW",\n',
              '            "settlement": "ONE_DURABLE_TRANSACTION_RECORD",\n            "reestimate": "CONTINUE_OR_REPLAN_REQUIRED",\n            "release": "ACTIVE_OR_REPLAN_REQUIRED_TO_RELEASED",\n            "scope_access": "WORKSPACE_MATCH_AND_EXISTING_AASM_SCOPE_FLOW",\n',
              'contract',
          )
          replace_once(
              '        settlements = {\n            key: value for key, value in projection["settlements"].items()\n            if value.get("reservation_id") in reservations\n        }\n        return {\n            "contract": self.resource_runtime_contract_report(),\n            "access_context": {"workspace_id": workspace_id, "scope_id": scope_id},\n            "capacities": visible_capacities,\n            "observations": observations,\n            "decisions": decisions,\n            "reservations": reservations,\n            "settlements": settlements,\n            "routing_transactions": routing_transactions,\n        }\n',
              '        settlements = {key: value for key, value in projection["settlements"].items() if value.get("reservation_id") in reservations}\n        reestimates = {key: value for key, value in projection["reestimates"].items() if value.get("reservation_id") in reservations}\n        releases = {key: value for key, value in projection["releases"].items() if value.get("reservation_id") in reservations}\n        return {\n            "contract": self.resource_runtime_contract_report(),\n            "access_context": {"workspace_id": workspace_id, "scope_id": scope_id},\n            "capacities": visible_capacities,\n            "observations": observations,\n            "decisions": decisions,\n            "reservations": reservations,\n            "settlements": settlements,\n            "reestimates": reestimates,\n            "releases": releases,\n            "routing_transactions": routing_transactions,\n        }\n',
              'report',
          )

          methods = '''

    def reestimate_resource_reservation(
        self,
        reservation_id: str,
        revised_allocations: Mapping[str, float],
        policy: ResourceRoutingPolicy,
        *,
        workspace_id: str | None = None,
        scope_id: str | None = None,
        evidence_ids=(),
    ) -> dict[str, Any]:
        projection = _project(self.snapshot)
        try:
            reservation = projection["reservations"][reservation_id]
        except KeyError:
            raise KeyError(reservation_id) from None
        self._validate_resource_context(workspace_id=workspace_id, scope_id=scope_id)
        if not _context_matches(reservation, workspace_id=workspace_id, scope_id=scope_id):
            raise PermissionError("resource reestimate crosses workspace/scope boundary")
        if reservation.get("status") != "ACTIVE":
            raise ValueError("resource reservation is not active")
        current = {str(resource_id): float(amount) for resource_id, amount in reservation.get("allocations", [])}
        revised = {str(key): float(value) for key, value in revised_allocations.items()}
        if set(revised) != set(current):
            raise ValueError("reestimate resource keys must exactly match reserved resources")
        if any(value < 0 for value in revised.values()):
            raise ValueError("reestimated resource demand must be non-negative")
        trial = {key: _capacity_from_dict(value) for key, value in projection["capacities"].items()}
        for resource_id, amount in current.items():
            trial[resource_id].release(amount)
        infeasible = []
        for resource_id, amount in sorted(revised.items()):
            available = planning_allocatable(trial[resource_id], policy)
            if available is None or amount > available:
                infeasible.append(resource_id)
        post_capacities = {}
        if infeasible:
            outcome = "REPLAN_REQUIRED"
            revised_rows = [[resource_id, amount] for resource_id, amount in sorted(current.items())]
        else:
            outcome = "CONTINUE"
            for resource_id, amount in sorted(revised.items()):
                trial[resource_id].reserve(amount)
                post_capacities[resource_id] = _capacity_to_dict(trial[resource_id])
            revised_rows = [[resource_id, amount] for resource_id, amount in sorted(revised.items())]
        seed = {
            "reservation_id": reservation_id,
            "workspace_id": workspace_id,
            "scope_id": scope_id,
            "previous_allocations": [[key, value] for key, value in sorted(current.items())],
            "revised_allocations": revised_rows,
            "requested_allocations": [[key, value] for key, value in sorted(revised.items())],
            "outcome": outcome,
            "infeasible_resources": infeasible,
            "post_capacities": post_capacities,
        }
        reestimate_id = f"resource-reestimate-{semantic_fingerprint(seed)[:20]}"
        document = {"reestimate_id": reestimate_id, **seed}
        evidence_id = self._record_resource_document(record_type="reservation_reestimate", object_id=reestimate_id, document=document, source=RESOURCE_RUNTIME_CONTRACT_ID, derived_from=evidence_ids)
        return {"reestimate": document, "evidence_id": evidence_id}

    def release_resource_reservation(
        self,
        reservation_id: str,
        *,
        workspace_id: str | None = None,
        scope_id: str | None = None,
        evidence_ids=(),
    ) -> dict[str, Any]:
        projection = _project(self.snapshot)
        try:
            reservation = projection["reservations"][reservation_id]
        except KeyError:
            raise KeyError(reservation_id) from None
        self._validate_resource_context(workspace_id=workspace_id, scope_id=scope_id)
        if not _context_matches(reservation, workspace_id=workspace_id, scope_id=scope_id):
            raise PermissionError("resource release crosses workspace/scope boundary")
        if reservation.get("status") not in {"ACTIVE", "REPLAN_REQUIRED"}:
            raise ValueError("resource reservation cannot be released from current status")
        allocations = {str(resource_id): float(amount) for resource_id, amount in reservation.get("allocations", [])}
        capacities = {key: _capacity_from_dict(value) for key, value in projection["capacities"].items()}
        post_capacities = {}
        for resource_id, amount in sorted(allocations.items()):
            capacities[resource_id].release(amount)
            post_capacities[resource_id] = _capacity_to_dict(capacities[resource_id])
        seed = {
            "reservation_id": reservation_id,
            "workspace_id": workspace_id,
            "scope_id": scope_id,
            "released_allocations": [[key, value] for key, value in sorted(allocations.items())],
            "post_capacities": post_capacities,
        }
        release_id = f"resource-release-{semantic_fingerprint(seed)[:20]}"
        document = {"release_id": release_id, **seed}
        evidence_id = self._record_resource_document(record_type="reservation_release", object_id=release_id, document=document, source=RESOURCE_RUNTIME_CONTRACT_ID, derived_from=evidence_ids)
        return {"release": document, "evidence_id": evidence_id}
'''
          marker = '\n\n__all__ = [\n    "RESOURCE_RUNTIME_CONTRACT_ID",\n'
          replace_once(marker, methods + marker, '__all__')
          path.write_text(text)
          PY
          rm .github/workflows/_apply-resource-reestimate-runtime.yml
          python -m compileall -q src/aasm
          python scripts/release_manifest.py --check-file-list
      - name: Commit runtime transition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add durable resource reestimate and release runtime'
          git push origin HEAD:main
