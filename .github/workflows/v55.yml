name: AASM v0.55 Compatibility

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: aasm-v55-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  v55:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Check frozen v0.55 engineering contracts
        run: |
          python scripts/check_v55_discrete_ir.py
          python scripts/check_v55_scheduling_ir.py
          python scripts/check_v55_continuous_ir.py
          python scripts/check_v55_decision_vector.py
          python scripts/check_v55_semantic_archive.py
      - name: Run complete v0.55 governed semantic evolution compatibility fixtures
        run: |
          pytest -q \
            tests/test_v55_semantic_evolution_foundation.py \
            tests/test_v55_semantic_evolution_runtime.py \
            tests/test_v55_model_feature_admission.py \
            tests/test_v55_solver_formulation.py \
            tests/test_v55_formulation_execution.py \
            tests/test_v55_discrete_ir.py \
            tests/test_v55_scheduling_ir.py \
            tests/test_v55_continuous_ir.py \
            tests/test_v55_decision_vector_ir.py \
            tests/test_v55_semantic_archive.py \
            tests/test_v55_public_candidate.py
      - name: Validate frozen v0.55 parent under active development root
        run: |
          python - <<'PY'
          import aasm
          from aasm import public_v55, public_v56
          report = public_v55.validate_public_api_contract()
          assert report['valid'], report
          assert public_v55.__version__ == '0.55.0'
          assert public_v55.PUBLIC_RELEASE_STABILITY == 'ACTIVE_DEVELOPMENT'
          assert public_v55.PUBLIC_API_CONTRACT['contract_version'] == '0.31.0'
          assert public_v56.validate_public_api_contract()['valid']
          assert aasm.__version__ == public_v56.__version__
          assert aasm.AASMEngine is public_v56.AASMEngine
          assert public_v55.AASMEngine is not aasm.AASMEngine
          print('v0.55 frozen parent compatibility under active development root: PASS')
          PY
      - name: Publish v0.55 compatibility status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='v0.55 semantic evolution, formulation, engineering IR, and archive compatibility passed'
          else
            state=failure
            description='v0.55 compatibility gate failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='aasm/v55' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
