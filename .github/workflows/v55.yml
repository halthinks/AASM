name: AASM v0.55 Foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  statuses: write

jobs:
  v55:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Repair discrete checker canonical ordering
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/aasm/discrete_ir.py')
          text = path.read_text(encoding='utf-8')
          old = 'expected_mapping_payload = [row.to_dict() for row in expected_mappings]'
          new = 'expected_mapping_payload = [row.to_dict() for row in sorted(expected_mappings, key=lambda row: row.source_constraint_id)]'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('discrete checker ordering repair target not found')
          PY
          if ! git diff --quiet -- src/aasm/discrete_ir.py; then
            git config user.name "aasm-ci"
            git config user.email "aasm-ci@users.noreply.github.com"
            git add src/aasm/discrete_ir.py
            git commit -m "Canonicalize discrete lowering checker mappings"
            git push origin HEAD:main
          fi
      - name: Canonically refresh tracked file inventory
        if: github.event_name == 'push'
        run: |
          python scripts/release_manifest.py --write-file-list
          if ! git diff --quiet -- FILE_LIST.txt; then
            git config user.name "aasm-ci"
            git config user.email "aasm-ci@users.noreply.github.com"
            git add FILE_LIST.txt
            git commit -m "Refresh tracked file inventory for discrete IR"
            git push origin HEAD:main
          fi
      - name: Verify tracked file inventory
        run: python scripts/release_manifest.py --check-file-list
      - name: Check v0.55 contract doctrine
        run: |
          python scripts/check_v55_contracts.py
          python scripts/check_v55_discrete_ir.py
      - name: Run v0.55 governed semantic evolution fixtures
        run: |
          pytest -q \
            tests/test_v55_semantic_evolution_foundation.py \
            tests/test_v55_semantic_evolution_runtime.py \
            tests/test_v55_model_feature_admission.py \
            tests/test_v55_solver_formulation.py \
            tests/test_v55_formulation_execution.py \
            tests/test_v55_discrete_ir.py
      - name: Guard released public surface
        run: |
          python - <<'PY'
          import aasm
          from aasm import AASMEngine
          assert aasm.__version__ == "0.54.0"
          assert AASMEngine.__module__ == "aasm.runtime_v54_full"
          print("released package remains v0.54 while v0.55 foundation is developed underneath it")
          PY
