name: One-shot adoption contract alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-align-adoption-contract.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Align stale cumulative adoption assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('scripts/check_release_contracts.py'),
              Path('.github/workflows/v56.yml'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count('0.32.13')
              if count == 0:
                  raise SystemExit(f'{path}: expected stale 0.32.13 token not found')
              path.write_text(text.replace('0.32.13', '0.32.14'), encoding='utf-8')
              print(f'{path}: replaced {count} stale adoption token(s)')
          PY
          git diff --check
          git diff --exit-code -- scripts/check_release_contracts.py .github/workflows/v56.yml && exit 0 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check_release_contracts.py .github/workflows/v56.yml
          git commit -m 'Align cumulative gates with adoption 0.32.14'
          git push origin HEAD:main
