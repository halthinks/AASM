name: AASM S4 Engineering Semantic Cumulative Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aasm-engineering-s4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  engineering-s4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AASM development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile cumulative S4 semantic layers
        run: |
          python -m compileall -q \
            src/aasm/quantity.py \
            src/aasm/rule.py \
            src/aasm/semantic_projection.py \
            src/aasm/_semantic_projection_core.py \
            src/aasm/_semantic_projection_equivalence.py \
            src/aasm/public_active_semantic_projection.py \
            src/aasm/uncertainty_scenario_trace.py \
            src/aasm/public_active_uncertainty_scenario_trace.py \
            src/aasm/degraded_operation.py \
            src/aasm/public_active_degraded_operation.py \
            src/aasm/risk_irreversibility.py \
            src/aasm/obligation_phase.py \
            src/aasm/safety_envelope_hybrid_state.py \
            src/aasm/_safety_envelope_common.py \
            src/aasm/_safety_envelope_records.py \
            src/aasm/_hybrid_state_records.py \
            src/aasm/_safety_envelope_assessment_records.py \
            src/aasm/_safety_envelope_validation.py \
            src/aasm/_safety_envelope_evaluation.py \
            src/aasm/epistemic_debt_manual_override.py \
            src/aasm/_epistemic_debt.py \
            src/aasm/_manual_override.py \
            scripts/check_quantity_contracts.py \
            scripts/check_quantity_public.py \
            scripts/check_rule_contracts.py \
            scripts/check_rule_public.py \
            scripts/check_semantic_projection_contracts.py \
            scripts/check_semantic_projection_public.py \
            scripts/check_uncertainty_scenario_trace_contracts.py \
            scripts/check_uncertainty_scenario_trace_public.py \
            scripts/check_degraded_operation_contracts.py \
            scripts/check_degraded_operation_public.py \
            scripts/check_risk_irreversibility_contracts.py \
            scripts/check_obligation_phase_contracts.py \
            scripts/check_safety_envelope_hybrid_state_contracts.py \
            scripts/check_epistemic_debt_manual_override_contracts.py \
            scripts/check_safety_governance_contracts.py
          python -m json.tool schemas/quantity.schema.json >/dev/null
          python -m json.tool schemas/rule.schema.json >/dev/null
          python -m json.tool schemas/semantic-projection.schema.json >/dev/null
          python -m json.tool schemas/uncertainty.schema.json >/dev/null
          python -m json.tool schemas/scenario.schema.json >/dev/null
          python -m json.tool schemas/trace-property.schema.json >/dev/null
          python -m json.tool schemas/degraded-operation.schema.json >/dev/null
          python -m json.tool schemas/degraded-operation-assessment.schema.json >/dev/null
          python -m json.tool schemas/risk-envelope.schema.json >/dev/null
          python -m json.tool schemas/effect-irreversibility.schema.json >/dev/null
          python -m json.tool schemas/irreversibility-assurance-policy.schema.json >/dev/null
          python -m json.tool schemas/risk-assessment.schema.json >/dev/null
          python -m json.tool schemas/obligation-phase-binding.schema.json >/dev/null
          python -m json.tool schemas/obligation-phase-plan.schema.json >/dev/null
          python -m json.tool schemas/obligation-phase-assessment.schema.json >/dev/null
          python -m json.tool schemas/safety-envelope.schema.json >/dev/null
          python -m json.tool schemas/hybrid-state.schema.json >/dev/null
          python -m json.tool schemas/safety-envelope-assessment.schema.json >/dev/null
          python -m json.tool schemas/epistemic-debt.schema.json >/dev/null
          python -m json.tool schemas/manual-override.schema.json >/dev/null
          python -m json.tool schemas/manual-override-assessment.schema.json >/dev/null
          python -m json.tool schemas/textpcb-s4-safety-fixture.schema.json >/dev/null
          python -m json.tool fixtures/textpcb/s4-safety-governance-fixtures.json >/dev/null
      - name: Check Quantity semantic contracts
        run: |
          python scripts/check_quantity_contracts.py
          python scripts/check_quantity_public.py
      - name: Check Rule semantic contracts
        run: |
          python scripts/check_rule_contracts.py
          python scripts/check_rule_public.py
      - name: Check Projection and Equivalence semantic contracts
        run: |
          python scripts/check_semantic_projection_contracts.py
          python scripts/check_semantic_projection_public.py
      - name: Check Uncertainty Scenario and Trace-Property semantic contracts
        run: |
          python scripts/check_uncertainty_scenario_trace_contracts.py
          python scripts/check_uncertainty_scenario_trace_public.py
      - name: Check Degraded Operation foundation and active public contracts
        run: |
          python scripts/check_degraded_operation_contracts.py
          python scripts/check_degraded_operation_public.py
      - name: Check Risk and Irreversibility pre-admission contracts
        run: python scripts/check_risk_irreversibility_contracts.py
      - name: Check Obligation Phase pre-admission contracts
        run: python scripts/check_obligation_phase_contracts.py
      - name: Check Safety Envelope and Hybrid State pre-admission contracts
        run: python scripts/check_safety_envelope_hybrid_state_contracts.py
      - name: Check Epistemic Debt and Manual Override pre-admission contracts
        run: python scripts/check_epistemic_debt_manual_override_contracts.py
      - name: Check permanent TextPCB fixture and aggregate safety-governance contracts
        run: python scripts/check_safety_governance_contracts.py
      - name: Run cumulative S4 semantic corpus
        run: |
          pytest -q \
            tests/test_quantity_foundation.py \
            tests/test_quantity_public.py \
            tests/test_rule_foundation.py \
            tests/test_rule_public.py \
            tests/test_semantic_projection_foundation.py \
            tests/test_semantic_projection_textpcb.py \
            tests/test_semantic_projection_adversarial.py \
            tests/test_semantic_projection_public.py \
            tests/test_uncertainty_scenario_trace_foundation.py \
            tests/test_uncertainty_scenario_trace_public.py \
            tests/test_degraded_operation_foundation.py \
            tests/test_degraded_operation_public.py \
            tests/test_risk_irreversibility_foundation.py \
            tests/test_obligation_phase_foundation.py \
            tests/test_safety_envelope_hybrid_state_foundation.py \
            tests/test_epistemic_debt_manual_override_foundation.py \
            tests/test_textpcb_s4_safety_governance.py
      - name: Publish cumulative S4 qualification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='S4 through active degraded 0.32.20 + all pre-admission foundations + TextPCB safety governance passed'
          else
            state=failure
            description='S4 cumulative semantic boundary failed'
          fi
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" \
              -f context='aasm/engineering-s4' \
              -f description="$description" \
              -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          echo 'failed to publish aasm/engineering-s4 after bounded retries' >&2
          exit 1
