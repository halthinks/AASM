name: One-shot v56 adoption test alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-align-v56-public-test.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Align legacy v56 public assertions with active adoption
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_v56_public_candidate.py')
          text = path.read_text(encoding='utf-8')
          count = text.count('0.32.14')
          if count != 2:
              raise SystemExit(f'{path}: expected exactly two stale 0.32.14 assertions, found {count}')
          path.write_text(text.replace('0.32.14', '0.32.15'), encoding='utf-8')
          print(f'{path}: aligned both legacy adoption assertions to 0.32.15')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_v56_public_candidate.py
          git diff --cached --quiet && exit 0
          git commit -m 'Align v56 public fixtures with adoption 0.32.15'
          git push origin HEAD:main
