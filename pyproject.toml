[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aasm-runtime"
version = "0.38.0"
description = "Algorithmic Agent State Machine: durable deterministic control for agents, tools, humans, models, and real work."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AASM contributors"}]
keywords = ["agents", "state-machine", "event-sourcing", "orchestration", "formal-methods"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "build==1.5.0", "jsonschema>=4.23"]
postgres = ["psycopg[binary]>=3.2"]
langgraph = ["langgraph>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/halthinks/AASM"
Repository = "https://github.com/halthinks/AASM"
Documentation = "https://github.com/halthinks/AASM#readme"
Issues = "https://github.com/halthinks/AASM/issues"
Changelog = "https://github.com/halthinks/AASM/blob/main/CHANGELOG.md"

[project.scripts]
aasm = "aasm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aasm = ["reference_data/research/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
